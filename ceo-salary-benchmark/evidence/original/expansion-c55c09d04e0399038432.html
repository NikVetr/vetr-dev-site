</script><script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","url":"https://rainforest-action-network.breezy.hr/p/dc33f7f96ee7-finance-manager?source=GoogleJobs","title":"Finance Manager","description":"<p><strong>ABOUT RAN</strong></p>\n<p>For more than 40 years, Rainforest Action Network (RAN) has campaigned to preserve forests, protect the climate, and uphold human rights by challenging corporate power and systemic injustice through research, education, partnerships, peaceful direct action, grassroots organizing, strategic campaigns, and communications. We are committed to working with Indigenous and frontline communities impacted directly. In partnership with allies from around the world, RAN challenges corporations to stop destructive operations, respect human rights, and adopt policies that reduce their contributions to climate change.</p>\n<p><strong>RACIAL JUSTICE, DIVERSITY, AND EQUITY</strong></p>\n<p>RAN strives to integrate values of equity and fairness into our work, which includes bringing an intentional racial justice and cultural equity analysis to our programmatic work and organizational structure. We strive to create an internal culture built on mutual trust, collaboration, and respect where all staff feel supported, valued, and heard. RAN values diversity in race, class, gender, culture, and religion, and implements programs internally to ensure that staff, board, and activists understand and adopt anti-oppression principles. For more information about RAN’s history, culture, and philosophy, please visit RAN’s website.</p>\n<p><strong>THE POSITION</strong></p>\n<p>At Rainforest Action Network, finance is more than stewardship; it is a critical tool for advancing campaigns that protect forests, defend human rights, and challenge the systems driving climate change. The Finance Manager plays a highly collaborative role at the intersection of mission and operations, helping ensure that RAN has the financial insight, systems, and resources needed to sustain and grow its impact.</p>\n<p>Reporting to the CFO and partnering closely with the Assistant Controller, program leaders, and Development team, the Finance Manager serves as a trusted thought partner to colleagues across the organization. This individual translates financial information into meaningful insights, helping teams understand performance, make informed decisions, and align resources with strategic priorities. From supporting annual planning and forecasting efforts to monitoring program budgets and leading donor financial reporting, the Finance Manager helps ensure that funding is effectively managed and deployed in service of RAN's mission.</p>\n<p>This is an exciting opportunity for a nonprofit finance professional who enjoys working in a mission-driven, collaborative environment and is energized by building strong partnerships with non-finance colleagues. The ideal candidate is equally comfortable diving into the details of grant compliance and monthly close activities as they are engaging in conversations about organizational priorities, strengthening financial processes, and leveraging technology to improve the effectiveness, efficiency, and accessibility of financial information. They are curious about how systems, tools, and automation can reduce administrative burden, enhance reporting capabilities, and support better decision-making across the organization. Their work will directly contribute to RAN's ability to respond to emerging opportunities, steward resources responsibly, and sustain bold campaigns for environmental and social justice around the world.</p>\n<p><strong>RESPONSIBILITIES</strong></p>\n<p>The Finance Manager is responsible for the following areas:</p>\n<p><strong>Financial Planning, Budgeting, and Analysis</strong></p>\n<ul><li>Support organizational budgeting, forecasting, and financial planning processes in collaboration with the CFO and department leaders.</li><li>Partner with program teams to develop annual program and departmental budgets, monitor expenditures, and track financial performance against plans.</li><li>Prepare monthly budget-to-actual reports, variance analyses, and financial forecasts to support informed decision-making by leadership team and program staff.</li><li>Support CFO in the preparation of financial reports and analyses.</li></ul>\n<p><strong>Grants and Donor Financial Management</strong></p>\n<ul><li>Manage financial administration for foundation, government, and international donor grants, including budgeting, forecasting, reporting, and restricted fund tracking.</li><li>Partner with Development and Program teams to prepare proposal budgets, monitor donor requirements, and ensure required documentation is complete.</li><li>Review spending, cost allowability, and compliance with approved budgets, donor rules, reporting deadlines, and organizational policies.</li><li>Prepare donor fund requests, manage partner disbursements, and support timely financial reporting, audits, and funder inquiries.</li></ul>\n<p><strong>Accounting Operations and Financial Stewardship</strong></p>\n<ul><li>Partner closely with the Assistant Controller to ensure the accurate recording of revenues, expenses, allocations, and grant activity.</li><li>Support monthly and year-end close processes, including journal entries, reconciliations, and review of financial transactions.</li><li>Assist with annual audit preparation and the compilation of schedules and supporting documentation.</li><li>Contribute to maintaining strong internal controls, financial policies, and procedures that safeguard organizational assets and support compliance.</li></ul>\n<p><strong>Cross-Functional Partnership and Systems Improvement</strong></p>\n<ul><li>Serve as a trusted financial partner to program leaders and non-finance staff, helping colleagues understand financial information and make data-informed decisions.</li><li>Identify opportunities to improve financial processes, reporting tools, and workflows to increase efficiency, transparency, and usability across the organization.</li><li>Leverage technology, automation, and financial systems to strengthen reporting capabilities, reduce administrative burden, and enhance the overall effectiveness of the finance function.</li><li>Contribute to building a culture of financial stewardship, continuous learning, and collaboration that supports RAN's mission and long-term sustainability.</li></ul>\n<p><strong>QUALIFICATIONS</strong></p>\n<p>Applicants will ideally have many of the following competencies and some of the following experience:</p>\n<ul><li>Bachelor’s degree in accounting, finance, business administration, or related field with 5–7+ years of nonprofit finance or accounting experience, preferably in a grant-funded environment.</li><li>Experience managing foundation, government, and international donor grants in a multi-donor funding environment (e.g., USAID, EU, UN agencies, or other bilateral or multilateral funders).</li><li>Familiarity with donor compliance, financial reporting, cost allowability, and audit requirements for government or international funding.</li><li>Demonstrated experience in budgeting, forecasting, financial planning and analysis, and translating financial information into actionable insights for organizational leaders.</li><li>Experience serving as a collaborative business partner to programmatic and non-finance staff, with the ability to communicate complex financial concepts clearly and build strong cross-functional relationships.</li><li>Experience with financial accounting systems and general ledger software; Intacct or similar nonprofit accounting systems, Blackbaud, Expensify, Questica preferred. Advanced Excel required. </li><li>Experience preparing program, departmental, and grant budgets, including indirect cost methodologies, shared cost allocations, and restricted funding management.</li><li>Strong financial analysis, accounting, and problem-solving skills, with exceptional attention to detail and the ability to balance multiple priorities in a dynamic environment.</li><li>Experience leveraging technology and financial systems to improve reporting, streamline processes, and increase the efficiency and effectiveness of finance operations; experience with Intacct or comparable nonprofit accounting systems strongly preferred.</li><li>Commitment to RAN’s mission and values.</li></ul>\n<p><strong>COMPENSATION</strong></p>\n<p>This is a full-time position with an anticipated salary range equivalent to <strong>$95,000-$105,000</strong> USD commensurate with experience. The position is remote and open to candidates based in the US. RAN has staff and partners in time zones across the world, and staff are expected to work flexibly in order to connect with colleagues. </p>\n<p>Benefits include RAN-paid health, dental, and vision insurance for the staff person and their partner/family, a retirement plan with a 3% employer contribution, and a slate of RAN-paid additional coverages. All staff are eligible for four weeks PTO (increases to five weeks after two years) as well as a paid winter break, generous paid holidays, a flexible work schedule, a 12-week paid sabbatical after every 5 years of service, and more.</p>\n<p><strong>​EQUAL OPPORTUNITY AND ACCESS</strong></p>\n<p>RAN is an equal opportunity employer and is committed to providing all people with equal access to employment and volunteer opportunities. If you need assistance with accommodations during our interview or employment processes, please indicate that in your cover letter. We encourage applicants of color and from other historically excluded identities to apply for this position.</p>\n<p><strong>BARGAINING UNIT STATUS</strong></p>\n<p>RAN is a union workplace; our staff are represented by RAN Alliance for Workers’ Rights (RAWR) via CWA 9415. This position is excluded from the bargaining unit.</p>\n<p></p>","employmentType":"FULL_TIME","datePosted":"2026-06-24","hiringOrganization":{"@type":"Organization","name":"Rainforest Action Network","logo":"https://attachments-cdn.breezy.hr/aa4d8d90-86c8-4fbf-8733-1ad95e541ddf/Logo.png","sameAs":"https://rainforest-action-network.breezy.hr"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressCountry":"US","addressRegion":"CA","addressLocality":"San Francisco"}},"baseSalary":{"@type":"MonetaryAmount","currency":"USD","value":{"@type":"QuantitativeValue","unitText":"YEAR","minValue":95000,"maxValue":105000}},"validThrough":"2026-09-09T20:45:19.646Z","jobLocationType":"TELECOMMUTE","applicantLocationRequirements":{"@type":"Country","name":"US"}}
