	{"@context":"http:\/\/schema.org\/","@type":"JobPosting","title":"Chief Executive Officer, Technical Assistance Collaborative","url":"https:\/\/eostransitions.applicantpool.com\/jobs\/1306611.html","description":"<p style=\"text-align: center; background: white;\"><strong><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: #0a233f;\">Technical Assistance Collaborative Seeks Chief Executive Officer<\/span><\/strong><\/p>\n<p style=\"line-height: normal; background: white;\">&nbsp;<\/p>\n<p style=\"line-height: normal; background: white; border: none; padding: 0in;\"><strong><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: #0a233f;\">About Technical Assistance Collaborative<\/span><\/strong><\/p>\n<p style=\"background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black; background: white;\">For more than three decades, the <\/span><a href=\"https:\/\/www.tacinc.org\/\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; background: white;\">Technical Assistance Collaborative (TAC)<\/span><\/a><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black; background: white;\"> has partnered with federal, state, and local agencies, foundations, advocates, and service providers to strengthen the systems that support some of the nation's most vulnerable populations. Founded in 1992 and based in Boston, TAC is a nationally respected nonprofit consulting organization dedicated to advancing policies and practices that empower people to live healthy, independent lives in the communities of their choice. Through its work across homelessness, affordable housing, behavioral health, health care, and human services systems, TAC has become a recognized thought leader in helping organizations and governments implement innovative, practical, and sustainable solutions that improve both individual outcomes and system performance.<\/span><\/p>\n<p style=\"background: white;\">&nbsp;<\/p>\n<p style=\"background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black; background: white;\">TAC's stellar reputation is built on deep subject matter expertise, a highly collaborative consulting model, and an unwavering commitment to mission-driven impact. Its multidisciplinary teams bring together professionals with extensive public and nonprofit sector experience-including nationally recognized experts and former senior government officials-who understand the complexities of housing, behavioral health, Medicaid, child welfare, juvenile justice, and community integration systems. Clients value TAC not only for its technical expertise and strategic insight, but also for its flexibility, tailored approach, and ability to navigate complex challenges with humanity, equity, and respect. Internally, TAC is equally recognized for fostering a supportive and values-driven culture that reflects the mission it advances every day.<\/span><\/p>\n<p style=\"background: white;\">&nbsp;<\/p>\n<p style=\"background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: #687287;\">Key Areas of TAC's Work &amp; Programs:<\/span><\/p>\n<ul>\n<li style=\"color: windowtext; tab-stops: list .5in; background: white;\"><span style=\"color: #414140;\"><a href=\"https:\/\/www.tacinc.org\/focus-areas\/homelessness\/\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif;\">Homelessness:<\/span><\/a><\/span><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black; background: white;\"> Supporting communities in preventing and ending homelessness through strategic resource alignment and supportive housing strategies. <\/span><\/li>\n<li style=\"color: windowtext; tab-stops: list .5in; background: white;\"><span style=\"color: #414140;\"><a href=\"https:\/\/www.tacinc.org\/focus-areas\/affordable-housing\/\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif;\">Affordable Housing:<\/span><\/a><\/span><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black; background: white;\"> Helping states and localities expand housing opportunities for extremely low-income individuals and people with disabilities through policy and financing solutions. <\/span><\/li>\n<li style=\"color: windowtext; tab-stops: list .5in; background: white;\"><span style=\"color: #414140;\"><a href=\"https:\/\/www.tacinc.org\/focus-areas\/mental-health-substance-use-disorder\/\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif;\">Mental Health &amp; Substance Use Disorders<\/span><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; background: white;\">:<\/span><\/a><\/span> <span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Assisting organizations and government entities<span style=\"background: white;\"> in aligning systems, leveraging resources, and improving access to effective behavioral health care and services. <\/span><\/span><\/li>\n<li style=\"color: windowtext; tab-stops: list .5in; background: white;\"><span style=\"color: #414140;\"><a href=\"https:\/\/www.tacinc.org\/focus-areas\/community-integration-housing-employment\/\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; background: white;\">Community Integration, Housing &amp; Employment:<\/span><\/a><\/span> <span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black; background: white;\">Guiding states in developing and implementing effective Olmstead plans and advancing community-based living opportunities. <\/span><\/li>\n<li style=\"color: windowtext; tab-stops: list .5in; background: white;\"><span style=\"color: #414140;\"><a href=\"https:\/\/www.tacinc.org\/focus-areas\/medicaid\/\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; background: white;\">Medicaid:<\/span><\/a><\/span> <span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black; background: white;\">Partnering with Medicaid programs to design financially sustainable, evidence-based behavioral health services and supports.<\/span><\/li>\n<\/ul>\n<p style=\"background: white;\">&nbsp;<\/p>\n<p><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black; background: white;\">TAC has a <\/span><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: windowtext;\">staff of 43<\/span><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black; background: white;\"> and annual revenue of approximately <\/span><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: windowtext;\">$14 million<\/span><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black; background: white;\">, primarily derived from its contracts and consulting assignments that range in size <\/span><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: windowtext;\">from $2,500 to $3 million and<\/span><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black; background: white;\"> vary from one-day to multi-year engagements<\/span><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: windowtext;\">. TAC is overseen by a small but diverse Board of Directors representing public agencies and advocacy groups related to mental health and housing, academia, and people with lived experience of mental health conditions. During the last year, TAC has been successfully managed by its interim CEO, a long-tenured TAC director who succeeded a 14-year CEO and who will resume her position once a new CEO is hired.<\/span><\/p>\n<p>&nbsp;<\/p>\n<p style=\"line-height: normal; background: white; border: none; padding: 0in;\"><strong><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: #0a233f;\">The CEO Opportunity<\/span><\/strong><\/p>\n<p style=\"line-height: normal; background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black; background: white;\">The CEO will have the rare opportunity to lead a nationally respected, mission-driven, non-profit consulting practice at the forefront of housing, homelessness, and behavioral health systems change. With an exceptional and experienced team, strong financial footing, longstanding client relationships, and a collaborative culture grounded in purpose rather than profit, the next leader will have the chance to build on TAC's 35-year legacy while helping shape the field's future. The CEO will work alongside some of the smartest and most committed professionals in the country to drive meaningful and responsive systems change, scale TAC's influence, cultivate the next generation of leaders, and guide the organization through an important period of evolutionary growth and modernization. <\/span><\/p>\n<p style=\"line-height: normal; background: white;\">&nbsp;<\/p>\n<p style=\"line-height: normal; background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black; background: white;\">In addition to assuming all managerial and administrative oversight of TAC, the CEO will build on existing strengths by focusing on the following: <\/span><\/p>\n<ul>\n<li style=\"background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: #687287;\">Vision and Strategy<\/span>\n<ul>\n<li style=\"background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Develop a long-term vision and strategy that ensures sustainability while reaffirming and protecting the organization's mission, values, and equity-centered approach while adapting to external realities. <\/span><\/li>\n<li style=\"background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Create an actionable roadmap for the organization's future by growing business development efforts, including the exploration of new markets, partnerships, and service lines to diversify revenue streams and reduce reliance on federal funding amid shifting political and policy environments.<\/span><\/li>\n<li style=\"background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Expand the organization's national visibility, thought leadership, and relationships with key influencers and decision-makers, helping communities and clients effectively communicate their impact and needs in a changing funding landscape. <\/span><\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p style=\"background: white;\">&nbsp;<\/p>\n<ul>\n<li style=\"background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: #687287;\">Organizational Capacity, Infrastructure, &amp; Leadership Continuity<\/span>\n<ul>\n<li style=\"background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Embrace technology and modern tools to enhance collaboration, cross-sector communication, product delivery, project management, and organizational effectiveness.<\/span><\/li>\n<li style=\"background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Strengthen organizational infrastructure, systems, communications, and operational processes to benefit from efficiencies. <\/span><\/li>\n<li style=\"background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Focus on staff development including leadership pipeline growth and succession planning to develop a thoughtful plan as TAC's most senior leaders consider personal transitions.<\/span><\/li>\n<li style=\"background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Support board development and expansion to strengthen governance and strategic partnerships.<\/span><\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p style=\"background: white;\">&nbsp;<\/p>\n<ul>\n<li style=\"background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: #687287;\">Culture and Communications<\/span>\n<ul>\n<li style=\"background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Protect and elevate the organization's people, culture, and mission-driven identity ensuring that TAC remains values-aligned, adaptive, and resilient.<\/span><\/li>\n<li style=\"background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Maintain morale, staff well-being, and organizational cohesion as the political and policy landscape continues to evolve.<\/span><\/li>\n<li style=\"background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Serve as a visible, relationship-oriented leader and ambassador for the organization, strengthening communications internally and externally through transparency, consistency, and active listening.<\/span><\/li>\n<li style=\"background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Listen, learn, and build trust so change management is well-informed. <\/span><\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p style=\"background: white;\">&nbsp;<\/p>\n<p>&nbsp;<\/p>\n<p style=\"line-height: normal; background: white; border: none; padding: 0in;\"><strong><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: #0a233f;\">Profile of the Ideal Candidate<\/span><\/strong><\/p>\n<p style=\"line-height: normal; background: white;\"><strong><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: #0a233f;\">Credentials:<\/span><\/strong><\/p>\n<ul>\n<li style=\"line-height: normal; background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">A minimum of <span style=\"background: white;\">ten years<\/span> of senior leadership, or equivalent experience.<\/span><\/li>\n<li style=\"line-height: normal; background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Proven business development, revenue generation, and\/or consulting experience. <\/span><\/li>\n<li style=\"line-height: normal; background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Demonstrated track record of understanding and working at the intersection of housing, behavioral health, homelessness, and human services systems.<\/span><\/li>\n<\/ul>\n<p style=\"line-height: normal; background: white;\">&nbsp;<\/p>\n<p style=\"line-height: normal; background: white;\"><strong><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: #0a233f;\">Skills and Qualities:<\/span><\/strong><\/p>\n<p style=\"line-height: normal; background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: #687287;\">Visionary and Credible Business Leader<\/span><\/p>\n<ul>\n<li style=\"line-height: normal; background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Skilled at serving as a compelling public-facing business developer and ambassador for a mission-based organization, a leader who can expand resources through income generation, grants, and\/or philanthropy. <\/span><\/li>\n<li style=\"background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Possess deep credibility in the field with the ability to confidently engage with stakeholders at all levels-from federal leaders to service recipients.<\/span><\/li>\n<li style=\"background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Able to develop, articulate, and champion a strategic vision externally and internally.<\/span><\/li>\n<li style=\"line-height: normal; background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black; background: white;\">Entrepreneurial<\/span><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\"> leader with financial acumen and governance experience at an organization of similar size and scale.<\/span><\/li>\n<\/ul>\n<p style=\"line-height: normal; background: white;\">&nbsp;<\/p>\n<p style=\"line-height: normal; background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: #687287;\">Savvy Networker and Collaborator with Excellent Communication Skills<\/span><\/p>\n<ul>\n<li style=\"line-height: normal; background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Charismatic and energizing, with the ability to engage deeply with others and inspire trust.<\/span><\/li>\n<li style=\"line-height: normal; background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Eager to be the public spokesperson for TAC to advance its impact and business development.<\/span><\/li>\n<li style=\"line-height: normal; background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Curious leader and collaborative decision-maker who is receptive to feedback, thoughtful about organizational change, able to bring people along through the change process, and engage in healthy disagreement.<\/span><\/li>\n<li style=\"line-height: normal;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: windowtext;\">Sound political and negotiation skills to ensure TAC remains engaged and relevant amidst change.<\/span><\/li>\n<li style=\"line-height: normal;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: windowtext;\">Appreciative of diverse perspectives, backgrounds, and experiences.<\/span><\/li>\n<\/ul>\n<p style=\"line-height: normal; background: white;\">&nbsp;<\/p>\n<p style=\"line-height: normal; background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: #687287;\">Empowering, Inclusive, &amp; Thoughtful Manager of People<\/span><\/p>\n<ul>\n<li style=\"line-height: normal; background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Able to manage, motivate, and empower highly skilled subject matter experts valuing and trusting their expertise and diverse perspectives in a supportive, mission-driven culture which is not overly corporate or hierarchical.<\/span><\/li>\n<li style=\"line-height: normal; background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Skilled at evaluating and sustaining an organizational structure that leverages staff strengths while building cohesion across teams to maximize the contribution of staff and minimize focus area silos. <\/span><\/li>\n<li style=\"line-height: normal; background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Lead with empathy, humility, emotional intelligence, and active listening creating space for staff voice and perspectives.<\/span><\/li>\n<li style=\"line-height: normal; background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Balance openness and flexibility with accountability and the ability to make difficult decisions when necessary.<\/span><\/li>\n<li style=\"background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Able to model and support a relational\/servant leadership approach and appropriate work\/life balance.<\/span><\/li>\n<\/ul>\n<p style=\"line-height: normal;\">&nbsp;<\/p>\n<p style=\"line-height: normal; border: none; padding: 0in;\"><strong><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: windowtext;\">Comp<\/span><\/strong><strong><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: #0a233f;\">ensation, Benefits, and Work Location:<\/span><\/strong><\/p>\n<p><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: windowtext;\">This is a full-time, salaried, exempt position with a starting salary range of $240,000 to $300,000,<\/span> <span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: windowtext;\">commensurate with experience and qualifications. TAC will tailor an actual offer based on the selected candidate's experience, industry knowledge, skills, and other factors that may prove relevant during the interview process. TAC offers a benefits package that currently includes but is not limited to health insurance (currently 80% of premiums), a flexible spending plan, vacation, holidays, sick and paid leave, and a 403(b) plan. While local residency is not required, a regular presence in the Boston office is an essential function of the position.<\/span><\/p>\n<p>&nbsp;<\/p>\n<p style=\"line-height: normal; background: white; border: none; padding: 0in;\"><strong><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: #0a233f;\">Application Process and Additional Information<\/span><\/strong><\/p>\n<p style=\"background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">TAC is an Equal Opportunity Employer and seeks applicants who can bring a variety of experiences, perspectives, and backgrounds to the team. TAC provides equal employment opportunities to all employees and applicants for employment without regard to race, color, religion, sex, national origin, disability, political affiliation, marital status, age, sexual orientation, gender identity, pregnancy, or any other characteristic protected by law. <\/span><\/p>\n<p style=\"background: white;\">&nbsp;<\/p>\n<p style=\"background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">Candidate must include a resume and a cover letter, both in PDF format, which describe how qualifications and experience match the needs and mission of TAC. Applications will be accepted until the position is filled. Upload required documents to: <\/span><a href=\"https:\/\/eostransitions.applicantpool.com\/jobs\/\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif;\">https:\/\/eostransitions.applicantpool.com\/jobs\/<\/span><\/a><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black; text-decoration: none; text-underline: none;\">.<\/span><\/p>\n<p style=\"background: white;\">&nbsp;<\/p>\n<p style=\"background: white;\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif; color: black;\">This executive search is being conducted by Eos Transition Partners consultant, John Tarvin. All submissions will be acknowledged and are confidential, and any questions can be submitted to John at: <\/span><a href=\"mailto:jtarvin@eostransitions.com\"><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif;\">jtarvin@eostransitions.com<\/span><\/a><span style=\"font-size: 11.0pt; font-family: 'Calibri',sans-serif;\">. <\/span><\/p>","identifier":{"@type":"PropertyValue","name":"Eos Transitions","sameAs":"1306611"},"datePosted":"2026-06-01 00:00:00","validThrough":"2031-07-03 00:00:00T23:59","employmentType":"FULL_TIME","baseSalary":{"@type":"MonetaryAmount","currency":"USD","value":{"@type":"QuantitativeValue","unitText":"YEAR","minValue":"240000","maxValue":"300000"}},"hiringOrganization":{"@type":"Organization","name":"Eos Transitions","sameAs":"https:\/\/eostransitions.applicantpool.com"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","streetAddress":"","addressLocality":"Boston","addressRegion":"MA","postalCode":"02111","addressCountry":"US"},"geo":{"@type":"GeoCoordinates","latitude":"42.36008250000000","longitude":"-71.05888010000000"}}}</script>

	function getParameterByName(name, url) {
		if (!url) url = window.location.href;
		name = name.replace(/[\[\]]/g, "\\$&");
		var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),

		if (!results) return null;
		if (!results[2]) return '';
		return decodeURIComponent(results[2].replace(/\+/g, " "));
	}

	async function getSeekButton(seek_token = '') {
		const applicationUri = window.location.href;
		let postBody = {
			domainId: 4297,
			input: {
				applicationUri,
			}
		};

		if(seek_token !== '') {
			postBody.input.seek_token = seek_token;
		}

		const request = await fetch('/core/api/seek-get-redirect-button', {
			method: 'POST',
			headers: {
				'Content-Type': 'application/json'
			},
			body: JSON.stringify(postBody)
		});

		if (!request.ok) {
			return;
		}

		const { data } = await request.json();

		// Check if we have the applyWithSeekButton data
		if (data && data.url && data.buttonLabel && data.images && data.images.accent) {
			// Find the existing SEEK button container and replace it
			const seekButtonContainer = document.querySelector('#seek_v2_button');
			if (seekButtonContainer) {
				// Create the new button HTML
				const newSeekButton = document.createElement('a');
				newSeekButton.href = data.url;
				newSeekButton.setAttribute('aria-roledescription', 'link');
				
				const buttonImage = document.createElement('img');
				buttonImage.setAttribute('aria-roledescription', 'link');
				buttonImage.alt = data.buttonLabel;
				buttonImage.src = data.images.accent;
				buttonImage.style.width = '100%';
				buttonImage.style.height = 'auto';
				
				newSeekButton.appendChild(buttonImage);
				
				// Replace the existing button with the new one
				seekButtonContainer.parentNode.replaceChild(newSeekButton, seekButtonContainer);
			}
		}
	}
</script>
<script type="text/javascript">
	async function fillSeekProfile(seek_prefill_id, seek_token) {
		if (!seek_prefill_id) {
			window.isSeekSubmit  = true;
			window.isSeekFromUrl = true;
			$('#is_seek_application').val(1);
 
			return;
 		}
		const request = await fetch('/core/api/prefill-with-seek', {
			method: 'POST',
			headers: {
				'Content-Type': 'application/json'
			},
			body: JSON.stringify({
				seek_prefill_id,
				seek_token
			})
		});
		if (!request.ok) {
			return;
		}
		const { data } = await request.json();

		// Check if data is not empty
		if (!data || Object.keys(data).length === 0) {
			return;
		}

		// Generate unique token and get existing application data
		var unique_token = A.generateUniqueID();
		var appData = AS.get('applicationInfo') || {};

		// Store the SEEK data and metadata
		appData.seek_prefill_id = seek_prefill_id;
		appData.seek_token = seek_token;
		appData.seek_unique_token = unique_token;
		appData.seek_full_profile = data;

		const userData = data.user || {};

		if("first_name" in userData) {
			// appData.first_name = userData.firstName;
			$('#first_name').val(userData.first_name);
		}
		if("last_name" in userData) {
			// appData.last_name = userData.lastName;
			$('#last_name').val(userData.last_name);
		}
		if("email" in userData) {
			// appData.email = userData.emailAddress;
			$('#email').val(userData.email);
		}
		if("contact_number" in userData) {
			// appData.contact_number = userData.phoneNumber;
			$('#contact_number').val(userData.contact_number);
		}
		if("contact_number_type" in userData) {
			// appData.contact_number_type = userData.phoneNumberType;
			$('#contact_number_type').val(userData.contact_number_type);
		}

		// Mark this as a SEEK submission
		window.isSeekSubmit = true;
		$('#is_seek_application').val(1);

		// Store the application data
		AS.set('applicationInfo', appData, 2700);

		// Auto-submit the form
		$('#apply').submit();
	}
</script>
