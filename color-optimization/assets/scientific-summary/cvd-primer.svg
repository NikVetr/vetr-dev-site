<svg xmlns="http://www.w3.org/2000/svg" width="690" height="346" viewBox="0 0 690 346" role="img">
<title>CVD simulation pipeline and a color pair losing modeled separation under deutan simulation</title><style>text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#243746}.small{font-size:12px;fill:#526471}.heading{font-size:17px;font-weight:700}</style>
<rect x="0" y="0" width="690" height="346" fill="#fff" /><text x="10" y="25" class="heading" >A · A model of altered color discrimination</text><rect x="10" y="44" width="207" height="65" fill="#f1f6f7" rx="4"/><text x="113" y="70" class="" text-anchor="middle">Display signal</text><text x="113" y="92" class="small" text-anchor="middle">linear sRGB</text><text x="225" y="83" class="" >→</text><rect x="243" y="44" width="207" height="65" fill="#f1f6f7" rx="4"/><text x="346" y="70" class="" text-anchor="middle">CVD simulation</text><text x="346" y="92" class="small" text-anchor="middle">Machado matrix</text><text x="458" y="83" class="" >→</text><rect x="476" y="44" width="207" height="65" fill="#f1f6f7" rx="4"/><text x="579" y="70" class="" text-anchor="middle">Displayed comparison</text><text x="579" y="92" class="small" text-anchor="middle">sRGB → color distance</text><text x="10" y="144" class="heading" >B · One pair under increasing deutan model severity</text><text x="10" y="174" class="small" >0 · no alteration</text><rect x="10" y="188" width="93" height="58" fill="#B4845C" rx="3"/><text x="56" y="236" class="" text-anchor="middle" style="fill:#fff;paint-order:stroke;stroke:#243746;stroke-width:2px">A</text><rect x="110" y="188" width="93" height="58" fill="#969257" rx="3"/><text x="156" y="236" class="" text-anchor="middle" style="fill:#fff;paint-order:stroke;stroke:#243746;stroke-width:2px">B</text><text x="10" y="270" class="" >ΔE00 = 17.2</text><text x="243" y="174" class="small" >0.5 · intermediate model</text><rect x="243" y="188" width="93" height="58" fill="#A48D5C" rx="3"/><text x="289" y="236" class="" text-anchor="middle" style="fill:#fff;paint-order:stroke;stroke:#243746;stroke-width:2px">A</text><rect x="343" y="188" width="93" height="58" fill="#9B9158" rx="3"/><text x="389" y="236" class="" text-anchor="middle" style="fill:#fff;paint-order:stroke;stroke:#243746;stroke-width:2px">B</text><text x="243" y="270" class="" >ΔE00 = 5.3</text><text x="476" y="174" class="small" >1 · app’s endpoint</text><rect x="476" y="188" width="93" height="58" fill="#9E925C" rx="3"/><text x="522" y="236" class="" text-anchor="middle" style="fill:#fff;paint-order:stroke;stroke:#243746;stroke-width:2px">A</text><rect x="576" y="188" width="93" height="58" fill="#9D915A" rx="3"/><text x="622" y="236" class="" text-anchor="middle" style="fill:#fff;paint-order:stroke;stroke:#243746;stroke-width:2px">B</text><text x="476" y="270" class="" >ΔE00 = 0.4</text><text x="10" y="303" class="small" >Original sRGB pair: A #B4845C · B #969257</text><text x="10" y="326" class="small" >Severity is a model parameter, not a percentage of vision lost. This is an illustrative pair.</text></svg>
