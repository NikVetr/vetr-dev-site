<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('plg.theme');if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<!-- No `user-scalable=no` and no `maximum-scale`: the specification forbids
     disabling zoom, and someone holding this out at arm's length in bad light is
     exactly the reader who needs to pinch it larger. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="board.docTitle">Conversation — Wanderwart</title>
<meta name="description" content="Tap a phrase and show it, full-screen, in the other person's language. Works offline.">
<meta name="color-scheme" content="light">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="conversation.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body class="board-body page-board">

<!-- The owner's side. A header small enough that the grid is what the page is. -->
<header class="board-header">
  <a class="brand board-brand" href="./"><img class="brand-mark brand-mark-light" src="data/brand/mark.svg" alt="" width="29" height="20"><img class="brand-mark brand-mark-dark" src="data/brand/mark-dark.svg" alt="" width="29" height="20"><span data-i18n="nav.brand">Wanderwart</span></a>
  <!-- Board title and the pair, as a statement of what is about to be shown to
       whom. Filled by `ui/conversation.js`. -->
  <p class="board-pair" id="board-pair"></p>
  <!-- The two controls are one item, so a header that wraps cannot part them. -->
  <div class="board-head-controls">
    <!-- Find: every context's buttons, by what they say. The field opens across this
         header, which is orientation only -- the bar under the grid has no room left. -->
    <button type="button" id="board-search" class="site-menu board-search-open" hidden><svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><path d="M10.5 4.5a6 6 0 1 1 0 12a6 6 0 1 1 0-12ZM15 15l5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <!-- Hidden until the page has wired it: pressed before then, it did nothing. -->
    <button type="button" id="site-menu" class="site-menu" hidden><span class="board-menu-bars" aria-hidden="true"></span></button>
  </div>
</header>

<main class="board-main">
  <!-- **One row**: back, the topic, and one owner-only menu. It was back, the topic,
       `Settings` and `Edit buttons`, which on a phone wrapped the bar onto a second
       line and spent it on two words nobody reads twice.

       The parent control lives on the grid and never on a message -- a message has no
       visible Back by design -- and it is present at the root too, where it leads out
       to the topic list rather than up a submenu. -->
  <div class="board-bar">
    <!-- An arrow and nothing else. Where it goes is obvious from where you are, and
         a word beside it was a word competing with the topic. -->
    <button type="button" id="board-up" class="board-up" hidden>
      <span class="board-up-arrow" aria-hidden="true">←</span>
    </button>
    <!-- Which conversation this is. The page's only `h1`, because on a board the
         topic *is* the page -- and it sits in the bar rather than the header so the
         brand line stays one quiet row. -->
    <h1 class="board-title" id="board-title"></h1>
    <!-- The owner's controls, as one group: when the topic and they cannot share a row,
         the group moves to a row of its own rather than the topic breaking inside a
         word to make room. -->
    <div class="board-bar-controls">
    <!-- Turn: the stranger's surfaces sideways for the whole conversation. Owner-only,
         like the header's settings; the message keeps its own Turn as well. -->
    <!-- Add: the reader's own buttons and trees. Its own control, so the header's bars
         can go straight to Settings rather than to a menu of two. Settings is not here
         as well: one door, in the header, where every page keeps it. -->
    <!-- Speak on tap: a button says its sentence where it is, for a listener who cannot
         look -- a driver, given one direction a tap. The waves are drawn only while it
         is on, as well as the fill. -->
    <!-- The eye: held, every button shows what it will say and what can come back. -->
    <button type="button" id="board-peek-bar" class="board-turn-bar board-peek-bar" hidden aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button type="button" id="board-tap-bar" class="board-turn-bar board-tap-bar" hidden aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4Z" fill="currentColor"/><path class="tap-waves" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
    </button>
    <button type="button" id="board-add-bar" class="board-turn-bar board-add-bar" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <button type="button" id="board-turn-bar" class="board-turn-bar" hidden aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20"><path d="M5 11A7 7 0 1 1 13.4 17.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M13.6 14 13.6 21.2 7.2 17.6Z" fill="currentColor"/></svg>
    </button>
    </div>
  </div>
  <div id="board-grid" class="board-grid" aria-busy="true"></div>
  <p id="board-status" class="board-status" role="status"></p>
</main>

<!-- The message surface is inserted here rather than over the whole document, so a
     board embedded in a future native shell keeps its own bounds. -->
<div id="board-stage" class="board-stage" hidden></div>

<script type="module" src="ui/conversation.js"></script>
</body>
</html>
