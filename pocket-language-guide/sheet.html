<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Export a pocket guide</title>
<meta name="color-scheme" content="light">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<header class="site-header">
  <div class="container">
    <a class="brand" href="./">Pocket Language Guide</a>
    <div class="spacer"></div>
    <a class="btn" id="to-studio" href="customize.html">Customise in the studio →</a>
  </div>
</header>

<main class="container sheet-page">
  <div class="sheet-head">
    <h1 id="title">Pocket guide</h1>
    <div class="sheet-where"><span id="pair-flags"></span></div>
    <p class="lede" id="subtitle"></p>
  </div>

  <div class="sheet-body">
    <form id="options" class="sheet-options" aria-label="Options">
      <div id="controls"></div>

      <div class="export-block">
        <button type="button" class="primary big" id="pdf">Export PDF</button>
        <div class="row">
          <button type="button" id="png">PNG</button>
          <button type="button" id="svg">SVG</button>
        </div>
        <div id="dpi-control"></div>
        <p class="status" id="status"></p>
        <ul class="warnings" id="warnings"></ul>
      </div>
    </form>

    <div class="sheet-preview">
      <div class="face-grid" id="faces" aria-label="Sheet preview"></div>
    </div>
  </div>
</main>

<script type="module" src="ui/sheet-options.js"></script>
</body>
</html>
