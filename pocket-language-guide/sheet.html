<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="quick.docTitle">Export a pocket guide</title>
<meta name="color-scheme" content="light">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<a class="skip-link" href="#faces" data-i18n="nav.skipToSheet">Skip to the sheet</a>
<header class="site-header">
  <div class="container">
    <a class="brand" href="./" data-i18n="nav.brand">Pocket Language Guide</a>
    <div class="spacer"></div>
    <a class="btn" id="to-studio" href="customize.html" data-i18n="nav.toStudio">Customise in the studio →</a>
    <a class="btn ghost back-link" href="./" data-i18n="nav.back">← All languages</a>
  </div>
</header>

<main class="container sheet-page">
  <div class="sheet-head">
    <h1 id="title">Pocket guide</h1>
    <p class="lede" id="subtitle"></p>
    <div class="sheet-where"><span id="pair-flags"></span></div>
  </div>

  <div class="sheet-body">
    <form id="options" class="sheet-options" data-i18n-label="quick.optionsLabel" aria-label="Options">
      <div id="controls"></div>

      <div class="export-block">
        <button type="button" class="primary big" id="pdf" data-i18n="common.exportPdf">Export PDF</button>
        <!-- Above the buttons it applies to, not below them. -->
        <div id="dpi-control"></div>
        <div class="row">
          <button type="button" id="png" data-i18n="common.png">PNG</button>
          <button type="button" id="svg" data-i18n="common.svg">SVG</button>
        </div>
        <p class="status" id="status"></p>
        <ul class="warnings" id="warnings"></ul>
      </div>
    </form>

    <div class="sheet-preview">
      <div class="face-grid" id="faces" data-i18n-label="quick.previewLabel" aria-label="Sheet preview" tabindex="-1">
        <p class="muted loading" data-i18n="quick.typesetting">Typesetting your sheet…</p>
      </div>
    </div>
  </div>
</main>

<footer class="page-footer">
  <a class="donate" href="https://www.givewell.org/donate"
     target="_blank" rel="noopener noreferrer external">
    <span class="donate-mark" aria-hidden="true">&#9829;</span>
    <span data-i18n="nav.donate">Donate to GiveWell</span>
  </a>
</footer>

<script type="module" src="ui/sheet-options.js"></script>
</body>
</html>
