<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="studio.docTitle">Customise a pocket guide</title>
<meta name="color-scheme" content="light">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<a class="skip-link" href="#face-area" data-i18n="nav.skipToSheet">Skip to the sheet</a>
<header class="site-header">
  <!-- The studio is full-width, so its header must be too: the shared .container
       cap left the brand 250px inboard of the panel it sits above. -->
  <div class="container container-wide">
    <a class="brand" href="./" data-i18n="nav.brand">Pocket Language Guide</a>
    <span class="muted small" id="pair"></span>
    <div class="spacer"></div>
    <span class="status" id="status"></span>
    <button type="button" class="primary" id="pdf" data-i18n="common.exportPdf">Export PDF</button>
    <button type="button" id="png" data-i18n="common.png">PNG</button>
    <a class="btn ghost back-link" href="./" data-i18n="nav.back">← All languages</a>
  </div>
</header>

<div class="banner" id="banner">
  <span data-i18n="studio.bannerQuestion">Too many options?</span>
  <button type="button" class="ghost" id="quiz-open" style="text-decoration: underline;" data-i18n="studio.helpMeDecide">Help me decide.</button>
  <div class="spacer"></div>
  <button type="button" class="ghost" id="banner-hide" data-i18n="studio.hide" data-i18n-label="studio.hideBanner" aria-label="Hide this banner">Hide</button>
</div>

<main class="studio">
  <h1 class="visually-hidden" data-i18n="studio.heading">Customise a pocket language guide</h1>
  <section data-i18n-label="studio.formattingLabel" aria-label="Formatting">
    <h2 class="panel-title" data-i18n="studio.formatPanel">Format</h2>
    <div id="format"></div>

    <h2 class="panel-title" style="margin-top: 1.2rem;" data-i18n="studio.filesPanel">Files</h2>
    <div class="row">
      <button type="button" id="svg" data-i18n="common.svg">SVG</button>
      <button type="button" id="csv-out" data-i18n="studio.exportCsv">Export CSV</button>
      <button type="button" id="csv-in" data-i18n="studio.importCsv">Import CSV</button>
      <!-- Driven by the button above, so it is not its own tab stop. -->
      <input type="file" id="csv-file" accept=".csv,text/csv" class="visually-hidden"
             tabindex="-1" aria-hidden="true">
    </div>
  </section>

  <div class="col-resizer" id="resize-format" role="separator" aria-orientation="vertical"
       tabindex="0" data-i18n-label="studio.resizeFormat" aria-label="Resize the format panel"></div>

  <section class="canvas" data-i18n-label="studio.pagesLabel" aria-label="Pages">
    <div class="row">
      <button type="button" id="grid-toggle" data-i18n="studio.allFaces">⊞ All faces</button>
      <span class="spacer"></span>
      <span class="small muted" id="canvas-note"></span>
    </div>
    <div id="face-area" tabindex="-1">
      <p class="muted loading" data-i18n="quick.typesetting">Typesetting your sheet…</p>
    </div>
  </section>

  <div class="col-resizer" id="resize-content" role="separator" aria-orientation="vertical"
       tabindex="0" data-i18n-label="studio.resizeContent" aria-label="Resize the content panel"></div>

  <section data-i18n-label="studio.contentPanel" aria-label="Content">
    <h2 class="panel-title" data-i18n="studio.contentPanel">Content</h2>
    <ul class="warnings" id="warnings"></ul>
    <div class="row small" style="margin-bottom: .5rem;">
      <button type="button" class="ghost" id="all-on" data-i18n="studio.allOn">All on</button>
      <button type="button" class="ghost" id="all-off" data-i18n="studio.allOff">All off</button>
      <button type="button" class="ghost" id="balance" data-i18n="studio.balance">Balance columns</button>
      <span class="spacer"></span>
      <span class="muted" id="counts"></span>
    </div>
    <div class="diff" id="diff" hidden></div>
    <div id="add-term"></div>
    <ul class="tree" id="tree"><li class="muted loading" data-i18n="studio.loadingTree">Loading the phrase list…</li></ul>
  </section>
</main>

<a class="donate" href="https://www.givewell.org/donate"
   target="_blank" rel="noopener noreferrer external"
   data-i18n-title="nav.donateTitle" title="Goes to GiveWell, a charity evaluator"
><span data-i18n="nav.donate">Donate</span></a>

<script type="module" src="ui/studio.js"></script>
</body>
</html>
