<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- `viewport-fit=cover` so `env(safe-area-inset-*)` reports real numbers: on a
     notched phone, and inside the native shell, the page draws behind the notch and
     the home indicator and pads itself back out in `style.css`. Still no
     `user-scalable=no` and no `maximum-scale` anywhere: disabling zoom is forbidden. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="studio.docTitle">Customise a pocket guide</title>
<meta name="color-scheme" content="light">
<link rel="icon" href="favicon.svg">
<!-- The conscript face, ahead of first layout. `font-display: block` hides pIqaD and
     tengwar until it arrives and then falls back to boxes, so a cold load on a slow
     connection showed boxes for the three seconds it waited. -->
<link rel="preload" href="data/fonts/latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<a class="skip-link" href="#face-area" data-i18n="nav.skipToSheet">Skip to the sheet</a>
<header class="site-header studio-header">
  <!-- The studio is full-width, so its header must be too: the shared .container
       cap left the brand 250px inboard of the panel it sits above. -->
  <div class="container container-wide">
    <a class="brand" href="./"><img class="brand-mark" src="favicon.svg" alt="" width="20" height="20"><span data-i18n="nav.brand">Phraselet</span></a>
    <span class="muted small" id="pair"></span>
    <div class="spacer"></div>
    <span class="banner" id="banner">
      <span data-i18n="studio.bannerQuestion">Too many options?</span>
      <button type="button" class="ghost" id="quiz-open" data-i18n="studio.helpMeDecide">Help me decide.</button>
    </span>
    <!-- A spacer on a desktop; on a phone the rule that forces the info line under
         the action line, so the header is two short rows rather than four. -->
    <div class="spacer header-break"></div>
    <span class="status" id="status"></span>
    <!-- The study side of the card. Deliberately not next to the banner's "Help me
         decide", which is the onboarding questionnaire and a different thing: this
         one sits with the actions, because it acts on the sheet you have built. -->
    <button type="button" id="drill-open" data-i18n="drill.open"
            data-i18n-title="drill.openTitle">Quiz</button>
    <button type="button" class="primary" id="pdf" data-i18n="common.exportPdf">Export PDF</button>
    <button type="button" id="png" data-i18n="common.png">PNG</button>
    <a class="btn ghost back-link" href="./" data-i18n="nav.back">← All languages</a>
    <!-- Phone only, hidden by CSS above 700px. `ui/panels.js` moves the banner, the
         quiz, PNG and the way out into the panel at that width and puts them back
         above it, so there is one of each control rather than a duplicate set --
         Export PDF stays on the header's own line, being what the page is for. -->
    <button type="button" class="header-more" id="header-more"
            aria-expanded="false" aria-controls="header-menu"
            data-i18n-label="studio.moreActions" aria-label="More actions">
      <svg class="more-glyph" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/>
      </svg>
    </button>
    <div class="header-menu" id="header-menu" hidden></div>
  </div>
</header>

<main class="studio">
  <h1 class="visually-hidden" data-i18n="studio.heading">Customise a pocket language guide</h1>
  <section data-i18n-label="studio.formattingLabel" aria-label="Formatting">
    <h2 class="panel-title" data-i18n="studio.formatPanel">Format</h2>
    <!-- Everything the panel's title bar collapses on a phone, in one region so the
         bar can name it with `aria-controls`. A plain block on a desktop. -->
    <div class="panel-body" id="format-body">
      <div id="format"></div>

      <h2 class="panel-title" style="margin-top: 1.2rem;" data-i18n="studio.filesPanel">Files</h2>
      <div class="row">
        <button type="button" id="svg" data-i18n="common.svg">SVG</button>
        <button type="button" id="csv-out" data-i18n="studio.exportCsv">Export CSV</button>
        <button type="button" id="csv-in" data-i18n="studio.importCsv">Import CSV</button>
        <!-- Driven by the button above, so it is not its own tab stop. -->
        <input type="file" id="csv-file" accept=".csv,text/csv" class="visually-hidden"
               tabindex="-1" aria-hidden="true">
      </div>
    </div>
  </section>

  <div class="col-resizer" id="resize-format" role="separator" aria-orientation="vertical"
       tabindex="0" data-i18n-label="studio.resizeFormat" aria-label="Resize the format panel"></div>

  <section class="canvas" data-i18n-label="studio.pagesLabel" aria-label="Pages">
    <div id="face-area" tabindex="-1">
      <p class="muted loading" data-i18n="quick.typesetting">Typesetting your sheet…</p>
    </div>
  </section>

  <div class="col-resizer" id="resize-content" role="separator" aria-orientation="vertical"
       tabindex="0" data-i18n-label="studio.resizeContent" aria-label="Resize the content panel"></div>

  <section data-i18n-label="studio.contentPanel" aria-label="Content">
    <h2 class="panel-title" data-i18n="studio.contentPanel">Content</h2>
    <div class="panel-body" id="content-body">
      <!-- Where the rendered images go on a touch device with no share sheet, so they
           can be saved by pressing and holding. A zip is unopenable there. -->
      <figure class="saved-images" id="saved-images" hidden></figure>
      <ul class="warnings" id="warnings"></ul>
      <div class="row small" style="margin-bottom: .5rem;">
        <button type="button" class="ghost" id="all-on" data-i18n="studio.allOn">All on</button>
        <button type="button" class="ghost" id="all-off" data-i18n="studio.allOff">All off</button>
        <button type="button" class="ghost" id="balance" data-i18n="studio.balance">Balance columns</button>
        <span class="spacer"></span>
        <span class="muted" id="counts"></span>
      </div>
      <!-- The phone's section grid, hidden by CSS above 700px: on a desktop the
           tree below is already a resizable panel with every section's own tick in
           front of you. `ui/chips.js` fills it, from the same filtered lists the
           tree is built from. -->
      <div class="section-picker" id="section-picker"></div>
      <div class="diff" id="diff" hidden></div>
      <div id="add-term"></div>
      <ul class="tree" id="tree"><li class="muted loading" data-i18n="studio.loadingTree">Loading the phrase list…</li></ul>
    </div>
  </section>
</main>

<a class="donate" href="https://www.givewell.org/donate"
   target="_blank" rel="noopener noreferrer external"
><span data-i18n="nav.donate">Donate</span></a>

<script type="module" src="ui/studio.js"></script>
</body>
</html>
