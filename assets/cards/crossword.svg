[data-art="crossword"] .letters { fill: var(--art-ink); font: 500 6.1px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
@media (prefers-reduced-motion: no-preference) {
[data-art="crossword"][data-playing] .letters text { animation: crossword-fill 7s linear infinite; }
