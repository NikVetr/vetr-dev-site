<style>
[data-art="crossword"] .cells { fill: var(--surface); stroke: var(--art-ink); stroke-width: 0.8; stroke-linejoin: round; }
[data-art="crossword"] .letters text { will-change: opacity; }
[data-art="crossword"] .letters { fill: var(--art-ink); font: 500 7.6px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
@media (prefers-reduced-motion: no-preference) {
[data-art="crossword"][data-playing] .letters text { animation: crossword-fill 7s linear infinite; }
@keyframes crossword-fill { 0% { opacity: 1; } 2.143% { opacity: 0; } 50% { opacity: 0; } 52.143% { opacity: 1; } 100% { opacity: 1; } }
}
</style>
