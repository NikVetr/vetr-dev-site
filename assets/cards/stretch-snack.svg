<svg xmlns="http://www.w3.org/2000/svg" data-period="12" data-player="stretch-snack" focusable="false">
<style>
[data-art="stretch-snack"] {container:stretch-card/size;--banner:#193f34;--bar-ink:#f5f5d8;--paper:#e9ecd9;--stage:#bed19b;--ink:#214839;--letter:#284e3f;--distant:#839c82;--jacket:#498274;--skin:#cd9877;--shoe:#294d47;--chair:#94a991;--marker:#bd582d;--rail:#849880;--line:#aebaa2}
:root[data-theme="dark"] [data-art="stretch-snack"] {--banner:#233f34;--bar-ink:#f0f4dc;--paper:#2c4138;--stage:#48604e;--ink:#d6e5c9;--letter:#e1ebd6;--distant:#7a9381;--jacket:#76aaa0;--skin:#ddb28d;--shoe:#bccbbc;--chair:#839784;--marker:#ffb16e;--rail:#677e6a;--line:#526a58}
[data-art="stretch-snack"] .routine {display:grid;grid-template-rows:minmax(16px,18%) minmax(0,1fr) 3px;width:100%;height:100%;background:var(--paper);color:var(--letter);font-family:system-ui,sans-serif}
[data-art="stretch-snack"] .routine-bar {display:flex;align-items:center;justify-content:space-between;gap:.4em;padding:0 4%;background:var(--banner);color:var(--bar-ink);font-size:clamp(10px,min(5.7cqw,9cqh),22px);line-height:1}
[data-art="stretch-snack"] .routine-bar b {font-weight:660;letter-spacing:-.03em}
[data-art="stretch-snack"] .timer {display:inline-flex;align-items:center;gap:.3em;font:600 .84em/1 ui-monospace,monospace;font-variant-numeric:tabular-nums}
[data-art="stretch-snack"] .timer svg {width:1.2em;height:1.2em}
[data-art="stretch-snack"] .storyboard {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));min-height:0}
[data-art="stretch-snack"] .movement {display:grid;grid-template-rows:minmax(0,1fr) auto;min-width:0;min-height:0;border-inline-end:1px solid var(--line);padding:1cqh 0 3cqh}
[data-art="stretch-snack"] .movement:last-child {border:0}
[data-art="stretch-snack"] .movement[data-current] {background:var(--stage)}
[data-art="stretch-snack"] .figure {display:block;width:100%;height:100%;overflow:visible}
[data-art="stretch-snack"] .caption {text-align:center;font-size:clamp(9px,min(5cqw,8.4cqh),23px);font-weight:650;line-height:1.1;letter-spacing:-.025em}
[data-art="stretch-snack"] .ruler {background:var(--rail)}
[data-art="stretch-snack"] .progress {display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left;background:var(--marker)}
[data-art="stretch-snack"] .ground {fill:var(--chair);opacity:.48}
[data-art="stretch-snack"] .seat {stroke:var(--chair);stroke-width:3.5}
[data-art="stretch-snack"] .trail {stroke:var(--marker);stroke-width:1.7;stroke-linecap:round;stroke-dasharray:.45 3.9}
[data-art="stretch-snack"] .target {stroke:var(--marker);stroke-width:1.2}
[data-art="stretch-snack"] .limb {stroke-linecap:round;stroke-linejoin:round}
[data-art="stretch-snack"] .leg {stroke:var(--ink);stroke-width:10.5}
[data-art="stretch-snack"] .arm {stroke:var(--skin);stroke-width:7.5}
[data-art="stretch-snack"] .foot {stroke:var(--shoe);stroke-width:6.7}
[data-art="stretch-snack"] .far .limb {stroke:var(--distant)}
[data-art="stretch-snack"] .body {fill:var(--jacket)}
[data-art="stretch-snack"] .skin {stroke:var(--skin)}
[data-art="stretch-snack"] .face {fill:var(--skin)}
[data-art="stretch-snack"] .hair {fill:#3a4941}
[data-art="stretch-snack"] .working {stroke:var(--marker)}
@container stretch-card (max-aspect-ratio:1.1/1) {
  [data-art="stretch-snack"] .routine {grid-template-rows:auto minmax(0,1fr) 3px}
  [data-art="stretch-snack"] .routine-bar {padding:4% 6%}
  [data-art="stretch-snack"] .storyboard {grid-template:repeat(3,minmax(0,1fr)) / minmax(0,1fr)}
  [data-art="stretch-snack"] .movement {grid-template:minmax(0,1fr) / minmax(0,1fr) minmax(0,.8fr);align-items:center;padding:0 4% 0 0;border-inline-end:0;border-bottom:1px solid var(--line)}
  [data-art="stretch-snack"] .movement:last-child {border-bottom:0}
  [data-art="stretch-snack"] .caption {text-align:start;font-size:clamp(11px,7cqw,21px)}
}
@container stretch-card (min-aspect-ratio:3.6/1) {
  [data-art="stretch-snack"] .routine {grid-template: minmax(0,1fr) 3px / minmax(0,.56fr) minmax(0,2fr)}
  [data-art="stretch-snack"] .routine-bar {flex-direction:column;align-items:start;justify-content:center;gap:.55em;padding:0 12%;font-size:clamp(11px,min(3.9cqw,16cqh),25px)}
  [data-art="stretch-snack"] .ruler {grid-column:1/-1}
  [data-art="stretch-snack"] .movement {grid-template:minmax(0,1fr) / minmax(0,1fr) minmax(0,.85fr);align-items:center;padding:0 4% 0 0}
  [data-art="stretch-snack"] .caption {text-align:start;font-size:clamp(10px,min(2.6cqw,16cqh),21px)}
}
</style>
