<style>
[data-art="raster-to-vector"] .slide, [data-art="raster-to-vector"] .counter { will-change: transform; }
[data-art="raster-to-vector"] .frame { fill: none; stroke: var(--art-line); stroke-width: 1; }
[data-art="raster-to-vector"] .mark { fill: none; stroke: var(--art-ink); stroke-width: 1; }
[data-art="raster-to-vector"] .divider-halo { stroke: #fff; stroke-width: 3; }
[data-art="raster-to-vector"] .divider { stroke: #1b1b1b; stroke-width: 1.2; }
[data-art="raster-to-vector"] .tag { fill: var(--art-paper); fill-opacity: 0.92; }
[data-art="raster-to-vector"] .tags text { fill: var(--art-ink); font: 7.5px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
@media (prefers-reduced-motion: no-preference) {
[data-art="raster-to-vector"][data-playing] .slide { animation: raster-to-vector-slide 6s ease-in-out infinite; }
[data-art="raster-to-vector"][data-playing] .counter { animation: raster-to-vector-counter 6s ease-in-out infinite; }
@keyframes raster-to-vector-slide { 0% { transform: translateX(0px); } 8.333% { transform: translateX(0px); } 25% { transform: translateX(66.96px); } 35% { transform: translateX(66.96px); } 65% { transform: translateX(-66.96px); } 75% { transform: translateX(-66.96px); } 91.667% { transform: translateX(0px); } 100% { transform: none; } }
@keyframes raster-to-vector-counter { 0% { transform: translateX(0px); } 8.333% { transform: translateX(0px); } 25% { transform: translateX(-66.96px); } 35% { transform: translateX(-66.96px); } 65% { transform: translateX(66.96px); } 75% { transform: translateX(66.96px); } 91.667% { transform: translateX(0px); } 100% { transform: none; } }
}
