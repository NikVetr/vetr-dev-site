<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" data-period="7" focusable="false">
<style>
@media (prefers-reduced-motion: no-preference) {
[data-art="stan2r"][data-started] .result {animation:stan2r-reveal 7s ease-in-out infinite}
    [data-art="stan2r"][data-started] .result.line-1 {animation-delay:.35s}
    @keyframes stan2r-reveal {0%,18% {opacity:0} 30%,88% {opacity:1} 100% {opacity:0}}
}
</style>
<text x="15" y="20" fill="var(--art-muted)" font-size="11">Stan</text>
    <text class="source line-0" x="15" y="46" fill="var(--art-ink)" font-size="12" font-family="ui-monospace,monospace">theta ~ beta(2, 2);</text><text class="source line-1" x="15" y="68" fill="var(--art-ink)" font-size="12" font-family="ui-monospace,monospace">successes ~ binomial(trials, theta);</text>
    <path d="M15 86H305" stroke="var(--art-line)"/>
    <text x="15" y="108" fill="var(--art-muted)" font-size="11">R · prior simulation</text>
    <text class="result line-0" x="15" y="134" fill="var(--art-ink)" font-size="12" font-family="ui-monospace,monospace">theta &lt;- rbeta(1, 2, 2)</text><text class="result line-1" x="15" y="156" fill="var(--art-ink)" font-size="12" font-family="ui-monospace,monospace">successes &lt;- rbinom(1, trials, theta)</text>
</svg>
