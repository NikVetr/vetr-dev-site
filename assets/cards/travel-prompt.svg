<svg xmlns="http://www.w3.org/2000/svg" data-period="24" focusable="false">
<style>
[data-art="travel-prompt"] {container:travel-brief / size}
[data-art="travel-prompt"] .tp-demo {--tp-ink:#182c49;--tp-muted:#435775;--tp-accent:#224e85;--tp-paper:#f2f6fc;--tp-tint:#243f66;--tp-line:#798ba5;--tp-picked:#d5e5f8;--tp-gold:#ffd092;--tp-output-ink:#f7f9ff;--tp-output-muted:#d2deee;position:absolute;inset:0;color:var(--tp-ink);font:550 14px/1.15 system-ui,sans-serif}
:root[data-theme="dark"] [data-art="travel-prompt"] .tp-demo {--tp-ink:#ebf2ff;--tp-muted:#b5c4dd;--tp-accent:#accaef;--tp-paper:#172338;--tp-tint:#23446f;--tp-line:#8199b9;--tp-picked:#304967}
[data-art="travel-prompt"] .tp-demo * {box-sizing:border-box}
[data-art="travel-prompt"] .tp-frame {position:absolute;inset:0;display:grid;grid-template-rows:55% minmax(0,1fr);background:var(--tp-paper);visibility:hidden}
[data-art="travel-prompt"] .tp-first {visibility:visible}
[data-art="travel-prompt"] .tp-editor,[data-art="travel-prompt"] .tp-output {display:flex;flex-direction:column;justify-content:center;align-items:stretch;min-width:0;gap:clamp(3px,min(1.1cqh,1.2cqw),10px);padding:clamp(5px,min(3cqh,4cqw),18px) clamp(7px,4cqw,24px)}
[data-art="travel-prompt"] .tp-demo svg {width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
[data-art="travel-prompt"] .tp-mode,[data-art="travel-prompt"] .tp-heading {display:flex;align-items:center;gap:.38em;font-size:clamp(12px,min(5.3cqw,9cqh),26px);font-weight:720;line-height:1.06;letter-spacing:-.03em}
[data-art="travel-prompt"] .tp-mode {align-self:flex-start;background:var(--tp-accent);color:var(--tp-paper);padding:.23em .48em;border-radius:.32em;white-space:nowrap}
[data-art="travel-prompt"] .tp-control,[data-art="travel-prompt"] .tp-extra-field {display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(2px,.8cqh,6px);min-width:0}
[data-art="travel-prompt"] .tp-extra-field,[data-art="travel-prompt"] .tp-goal {display:none}
[data-art="travel-prompt"] .tp-label,[data-art="travel-prompt"] .tp-value {font-size:clamp(10px,min(3.9cqw,6.4cqh),18px);font-weight:600;line-height:1.1}
[data-art="travel-prompt"] .tp-value {color:var(--tp-muted);font-weight:500}
[data-art="travel-prompt"] .tp-input,[data-art="travel-prompt"] .tp-option {color:var(--tp-ink);border:1px solid var(--tp-line);border-radius:.28em;background:var(--tp-paper);padding:.24em .48em;font-size:clamp(10px,min(4cqw,6.7cqh),20px);line-height:1.14}
[data-art="travel-prompt"] .tp-input {font-weight:450}
[data-art="travel-prompt"] .tp-choices {display:flex;gap:.28em}
[data-art="travel-prompt"] .tp-option {flex:1 1 0;min-width:0;text-align:center;white-space:nowrap;font-weight:600}
[data-art="travel-prompt"] .tp-selected {color:var(--tp-accent);border-color:var(--tp-accent);background:var(--tp-picked)}
[data-art="travel-prompt"] .tp-slider {display:flex;align-items:center;gap:.6em;min-height:1.1em}
[data-art="travel-prompt"] .tp-track {position:relative;flex:1;height:clamp(4px,.8cqh,7px);border-radius:6px;background:var(--tp-line)}
[data-art="travel-prompt"] .tp-fill {position:absolute;inset:0 auto 0 0;width:var(--point);background:var(--tp-accent);border-radius:inherit}
[data-art="travel-prompt"] .tp-thumb {position:absolute;left:var(--point);top:50%;width:clamp(9px,4.3cqh,18px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:var(--tp-accent)}
[data-art="travel-prompt"] .tp-output {background:var(--tp-tint);color:var(--tp-output-ink);border-top:2px solid var(--tp-gold)}
[data-art="travel-prompt"] .tp-heading {color:var(--tp-gold);font-size:clamp(10px,min(3.9cqw,6.4cqh),19px)}
[data-art="travel-prompt"] .tp-text {font:500 clamp(15px,min(6cqw,10.5cqh),31px)/1.14 Georgia,serif;letter-spacing:-.015em}
[data-art="travel-prompt"] .tp-excerpt {display:block}
@container travel-brief (min-aspect-ratio:1.85/1) {
 [data-art="travel-prompt"] .tp-frame {grid-template-columns:49% minmax(0,1fr);grid-template-rows:100%}
 [data-art="travel-prompt"] .tp-editor,[data-art="travel-prompt"] .tp-output {padding-inline:clamp(6px,2.5cqw,20px)}
 [data-art="travel-prompt"] .tp-output {border-top:0;border-left:2px solid var(--tp-gold)}
}
@container travel-brief (min-height:222px) {
 [data-art="travel-prompt"] .tp-extra-field {display:grid}
 [data-art="travel-prompt"] .tp-goal {display:block;color:var(--tp-output-muted);font-size:.8em;margin-bottom:.4em}
}
@container travel-brief (min-aspect-ratio:1.85/1) and (min-height:135px) {
 [data-art="travel-prompt"] .tp-extra-field {display:grid}
 [data-art="travel-prompt"] .tp-goal {display:block;color:var(--tp-output-muted);font-size:.8em;margin-bottom:.4em}
}
@container travel-brief (max-width:265px) and (max-height:110px) {
 [data-art="travel-prompt"] .tp-mode {max-width:100%;white-space:normal;font-size:11px;padding:.22em .33em}
 [data-art="travel-prompt"] .tp-option:not(.tp-selected) {display:none}
 [data-art="travel-prompt"] .tp-slider {flex-direction:column;align-items:stretch;gap:.3em}
 [data-art="travel-prompt"] .tp-track {flex:none}
}
[data-art="travel-prompt"][data-started] .tp-frame {animation:travel-show 24s step-end var(--phase) infinite both}
[data-art="travel-prompt"][data-started] .tp-excerpt {animation:travel-write 24s ease-out var(--phase) infinite both}
[data-art="travel-prompt"][data-started] .tp-thumb {animation:travel-position 24s ease-out var(--phase) infinite both}
[data-art="travel-prompt"][data-started] .tp-fill {animation:travel-fill 24s ease-out var(--phase) infinite both}
@keyframes travel-show {0%,100%{visibility:visible}12.5%{visibility:hidden}}
@keyframes travel-write {0%{opacity:.72;transform:translateY(.09em)}1.6%,100%{opacity:1;transform:translateY(0)}}
@keyframes travel-position {0%{left:var(--from)}1.6%,100%{left:var(--point)}}
@keyframes travel-fill {0%{width:var(--from)}1.6%,100%{width:var(--point)}}
</style>
<foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" class="tp-demo"><div class="tp-frame tp-first" data-sample="lodging-0" style="--phase:-24s">
    <div class="tp-editor">
      <span class="tp-mode"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 19V6m20 13v-7H2m0 5h20M4 12V8h5v4m2-4h7a3 3 0 0 1 3 3v1h-10z" />
      </svg>Find lodging</span>
      <div class="tp-extra-field"><span class="tp-label">Budget for all rooms</span><span class="tp-input">¥18,000</span></div>
      <div class="tp-control"><span class="tp-label">Budget period</span><div class="tp-choices"><span class="tp-option tp-selected">Per night</span><span class="tp-option">Whole stay</span></div></div>
    </div>
    <div class="tp-output"><span class="tp-heading"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 3h9l5 5v13H5zM14 3v6h5M8 13h8m-8 4h6" />
      </svg>Your prompt</span>
      <div class="tp-text"><span class="tp-goal">Research 3 lodging options that fit this request.</span><span class="tp-excerpt">Budget per night: ¥18,000</span></div>
    </div>
  </div><div class="tp-frame" data-sample="lodging-1" style="--phase:-21s">
