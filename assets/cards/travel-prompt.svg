<svg xmlns="http://www.w3.org/2000/svg" data-period="16" focusable="false">
<style>
[data-art="travel-prompt"] {container:trip-atlas / size;background:#e5e7ca}
[data-art="travel-prompt"] .atlas {position:absolute;inset:0;display:grid;grid-template-rows:minmax(0,1fr) 40%;background:#eee8d5;color:#254f45}
[data-art="travel-prompt"] .map-window {position:relative;overflow:hidden;background:#e5e7ca}
[data-art="travel-prompt"] .map-window svg {display:block;width:100%;height:100%;overflow:visible}
[data-art="travel-prompt"] .paper {position:relative;min-width:0;background:#faf1da;border-top:1px dashed #aeaa8c}
[data-art="travel-prompt"] .paper .stop {position:absolute;inset:0}
[data-art="travel-prompt"] .entry {height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:clamp(2px,1cqh,6px);padding:1.2cqh 6cqw}
[data-art="travel-prompt"] .place {display:flex;align-items:center;gap:.42em;font:700 clamp(9px,min(3.6cqw,6.5cqh),17px)/1.05 system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:#85523e}
[data-art="travel-prompt"] .place svg {width:.95em;height:1.05em;flex:none}
[data-art="travel-prompt"] .entry strong {font:600 clamp(15px,min(6.2cqw,12cqh),38px)/1.03 Georgia,serif;letter-spacing:-.035em;text-wrap:balance}
[data-art="travel-prompt"] .note {font:500 clamp(10px,min(4.1cqw,7cqh),22px)/1.12 system-ui,sans-serif}
[data-art="travel-prompt"] .stop:not(.stop-0) {opacity:0}
[data-art="travel-prompt"] .trail {stroke-dasharray:100 110;stroke-dashoffset:68}
[data-art="travel-prompt"] .traveler {stroke-dashoffset:-32}
[data-art="travel-prompt"] .arrival, [data-art="travel-prompt"] .ripple {opacity:0}
[data-art="travel-prompt"] .ripple {transform-box:fill-box;transform-origin:center}
:root[data-theme="dark"] [data-art="travel-prompt"] .map-window {filter:brightness(.84) saturate(.89)}
:root[data-theme="dark"] [data-art="travel-prompt"] .paper {background:#e6e3cb}
@container trip-atlas (min-aspect-ratio:1.85/1) {
 [data-art="travel-prompt"] .atlas {grid-template-rows:100%;grid-template-columns:54% minmax(0,1fr)}
 [data-art="travel-prompt"] .paper {border-top:0;border-left:1px dashed #aeaa8c}
 [data-art="travel-prompt"] .entry {padding:2cqh 3.1cqw;gap:clamp(3px,3cqh,12px)}
 [data-art="travel-prompt"] .entry strong {font-size:clamp(14px,min(4.7cqw,18cqh),38px)}
 [data-art="travel-prompt"] .note {font-size:clamp(10px,min(3.3cqw,12cqh),22px)}
 [data-art="travel-prompt"] .place {font-size:clamp(8px,min(2.6cqw,10cqh),16px)}
}
[data-art="travel-prompt"][data-started] .map-sheet {animation:trip-pan 16s ease-in-out infinite}
[data-art="travel-prompt"][data-started] .stop {animation:trip-stop 16s var(--phase) infinite both}
[data-art="travel-prompt"][data-started] .trail {animation:trip-trail 16s var(--phase) infinite both}
[data-art="travel-prompt"][data-started] .traveler {animation:trip-traveler 16s var(--phase) infinite both}
[data-art="travel-prompt"][data-started] .arrival {animation:trip-arrival 16s var(--phase) infinite both}
[data-art="travel-prompt"][data-started] .ripple {animation:trip-ripple 16s var(--phase) infinite both}
[data-art="travel-prompt"][data-started] .entry {animation:trip-entry 16s var(--phase) infinite both}
@keyframes trip-pan {0%,100%{transform:translate(0,0)}12%{transform:translate(3px,2px)}37%,59%{transform:translate(-4px,-2px)}82%,91%{transform:translate(-3px,3px)}}
@keyframes trip-stop {0%,19%,100%{opacity:1}21%,94%{opacity:0}97%{opacity:1}}
@keyframes trip-trail {0%,100%{stroke-dashoffset:68}7%,21%{stroke-dashoffset:0}94%,97%{stroke-dashoffset:100}}
@keyframes trip-traveler {0%,100%{stroke-dashoffset:-32}7%,21%{stroke-dashoffset:-100}94%,97%{stroke-dashoffset:0}}
@keyframes trip-arrival {0%,6%,22%,100%{opacity:0}7%,20%{opacity:1}}
@keyframes trip-ripple {0%,6%{opacity:0;transform:scale(.6)}7%{opacity:.9;transform:scale(.6)}15%,100%{opacity:0;transform:scale(1.9)}}
@keyframes trip-entry {0%,17.5%,100%{opacity:1;transform:translateY(0)}19.5%{opacity:0;transform:translateY(-6%)}95%{opacity:0;transform:translateY(10%)}99%{opacity:1;transform:translateY(0)}}
</style>
