<svg xmlns="http://www.w3.org/2000/svg" data-period="9" data-frames="4" focusable="false">
<style>
[data-art="rota"] .frame + .frame { opacity: 0; }
[data-art="rota"] .frame.first { will-change: opacity; }
[data-art="rota"] .rc { box-sizing: border-box; width: 100%; height: 100%; container-type: size; background: var(--art-paper); color: #e6eaf2; overflow: hidden;
  font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
[data-art="rota"] .in { box-sizing: border-box; width: 100%; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.04fr);
  grid-template-rows: minmax(0, 1fr) auto; gap: min(3cqh, 1.8cqw) min(3cqh, 2cqw); padding: min(3cqh, 1.8cqw); }
[data-art="rota"] .rc p, [data-art="rota"] .rc pre { margin: 0; }
[data-art="rota"] .term { background: #0a0d12; border: 1.5px solid #2a3344; border-radius: min(4.5cqh, 2.5cqw); padding: min(3.2cqh, 1.8cqw) min(4cqh, 2.2cqw); display: flex; flex-direction: column; gap: min(2.4cqh, 1.3cqw); min-width: 0; }
[data-art="rota"] .bar { display: flex; align-items: center; gap: min(1.6cqh, 0.9cqw); font: 600 min(4cqh, 2.2cqw) system-ui, sans-serif; color: #8b95a7; }
[data-art="rota"] .bar i { width: min(3.2cqh, 1.8cqw); height: min(3.2cqh, 1.8cqw); border-radius: 50%; background: #ff5f57; }
[data-art="rota"] .bar i:nth-child(2) { background: #febc2e; } [data-art="rota"] .bar i:nth-child(3) { background: #28c840; }
[data-art="rota"] .cmd { font-size: min(4.6cqh, 2.5cqw); line-height: 1.4; white-space: pre; }
[data-art="rota"] .line { display: none; font-size: min(7cqh, 1.75cqw); white-space: pre; }
[data-art="rota"] .mon { margin-top: auto !important; font: 600 min(3.8cqh, 2.1cqw) system-ui, sans-serif; color: #8b95a7; }
[data-art="rota"] .tbl { font-size: min(3.9cqh, 2.1cqw); line-height: 1.45; color: #afd7ff; white-space: pre; }
[data-art="rota"] .tbl .head { color: #808080; }
[data-art="rota"] .hosts { display: grid; gap: min(3cqh, 1.7cqw); align-content: start; min-width: 0; }
[data-art="rota"] .host { background: #1b2230; border: 1.5px solid #2a3344; border-radius: min(4.5cqh, 2.5cqw); padding: min(2.6cqh, 1.5cqw) min(3.2cqh, 1.8cqw); }
[data-art="rota"] .host p { display: flex; justify-content: space-between; align-items: baseline; font: 700 min(5cqh, 2.8cqw) system-ui, sans-serif; margin-bottom: min(2cqh, 1.1cqw) !important; }
[data-art="rota"] .host p span { font-weight: 400; font-size: 0.75em; color: #8b95a7; }
[data-art="rota"] .cells { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: min(2.2cqh, 1.2cqw); }
[data-art="rota"] .cell { position: relative; aspect-ratio: 1; max-height: min(14cqh, 8cqw); border-radius: 18%; border: 1.5px solid #2a3344; background: #151b25; overflow: hidden; }
[data-art="rota"] .cell.q-a { --c: #4fb6d8; } [data-art="rota"] .cell.q-b { --c: #f0a04b; }
[data-art="rota"] .cell[class*="q-"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 22%, #151b25); }
[data-art="rota"] .cell i { position: absolute; left: 0; bottom: 0; width: 100%; background: var(--c); opacity: .9; }
[data-art="rota"] .cell b { position: absolute; inset: 0; display: grid; place-items: center; font-size: min(5cqh, 2.6cqw); color: #fff; text-shadow: 0 0 2px #000, 0 0 3px #000; }
[data-art="rota"] .caption { grid-column: 1 / -1; text-align: center; font: 600 min(5.2cqh, 2.9cqw) system-ui, sans-serif; color: var(--art-ink); }
@container (min-aspect-ratio: 5 / 2) {
  [data-art="rota"] .in { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: min(3cqh, 0.8cqw); }
  [data-art="rota"] .term { flex-direction: row; align-items: center; padding: min(3cqh, 1cqw) min(4cqh, 1.4cqw); }
  [data-art="rota"] .cmd, [data-art="rota"] .mon, [data-art="rota"] .tbl { display: none; }
  [data-art="rota"] .line { display: block; }
  [data-art="rota"] .hosts { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); align-content: stretch; }
  [data-art="rota"] .host { display: flex; flex-direction: column; justify-content: center; padding: min(2.5cqh, 0.6cqw) min(3cqh, 0.9cqw); }
  [data-art="rota"] .host p { margin-bottom: min(2cqh, 0.4cqw) !important; }
  [data-art="rota"] .cell { max-height: min(30cqh, 6cqw); }
  [data-art="rota"] .cells.n8 { grid-template-columns: repeat(8, minmax(0, 1fr)); }
  [data-art="rota"] .host p { font-size: min(9cqh, 1.9cqw); }
  [data-art="rota"] .cell b { font-size: min(9cqh, 1.6cqw); }
  [data-art="rota"] .caption { font-size: min(9cqh, 1.9cqw); }
}
[data-art="rota"][data-started] .frame { animation: rota-frame 9s step-end infinite; }
@keyframes rota-frame { 0% { opacity: 1; } 25% { opacity: 0; } 100% { opacity: 0; } }
</style>
<g class="frame first"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" class="rc"><div class="in">
<div class="term"><p class="bar"><i></i><i></i><i></i><span>storage</span></p><pre class="cmd">$ rota set-priority
    --batch_dir &quot;$B&quot;
    --schedule_priority 90</pre><pre class="line">$ rota set-priority --batch_dir &quot;$B&quot; --schedule_priority 90</pre>
<p class="mon">rota monitor: QUEUE PROGRESS</p><pre class="tbl"><span class="head">Queue Workers Priority Admission</span>
B     3-7     90 (#1)  CPU wait
A     1-1     50 (#2)  CPU wait</pre></div>
<div class="hosts"><div class="host"><p><b>storage</b><span>4 CPU</span></p><div class="cells n4"><span class="cell q-a"><i style="height:26%"></i><b>A</b></span><span class="cell q-b"><i style="height:81%"></i><b>B</b></span><span class="cell q-b"><i style="height:30%"></i><b>B</b></span><span class="cell q-b"><i style="height:12%"></i><b>B</b></span></div></div><div class="host"><p><b>worker</b><span>8 CPU</span></p><div class="cells n8"><span class="cell q-b"><i style="height:16%"></i><b>B</b></span><span class="cell q-b"><i style="height:19%"></i><b>B</b></span><span class="cell q-b"><i style="height:73%"></i><b>B</b></span><span class="cell q-b"><i style="height:12%"></i><b>B</b></span><span class="cell q-b"><i style="height:78%"></i><b>B</b></span><span class="cell q-b"><i style="height:13%"></i><b>B</b></span><span class="cell q-b"><i style="height:35%"></i><b>B</b></span><span class="cell q-a"><i style="height:57%"></i><b>A</b></span></div></div></div>
<p class="caption">B at priority 90 takes each slot that frees up</p></div></div></foreignObject></g>
<g class="frame" style="animation-delay:2.25s"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" class="rc"><div class="in">
<div class="term"><p class="bar"><i></i><i></i><i></i><span>storage</span></p><pre class="cmd">$ rota set-priority
    --batch_dir &quot;$B&quot;
    --schedule_priority 90</pre><pre class="line">$ rota set-priority --batch_dir &quot;$B&quot; --schedule_priority 90</pre>
<p class="mon">rota monitor: QUEUE PROGRESS</p><pre class="tbl"><span class="head">Queue Workers Priority Admission</span>
B     3-8     90 (#1)  CPU wait
A     1-0     50 (#2)  CPU wait</pre></div>
<div class="hosts"><div class="host"><p><b>storage</b><span>4 CPU</span></p><div class="cells n4"><span class="cell q-a"><i style="height:56%"></i><b>A</b></span><span class="cell q-b"><i style="height:20%"></i><b>B</b></span><span class="cell q-b"><i style="height:75%"></i><b>B</b></span><span class="cell q-b"><i style="height:50%"></i><b>B</b></span></div></div><div class="host"><p><b>worker</b><span>8 CPU</span></p><div class="cells n8"><span class="cell q-b"><i style="height:55%"></i><b>B</b></span><span class="cell q-b"><i style="height:52%"></i><b>B</b></span><span class="cell q-b"><i style="height:15%"></i><b>B</b></span><span class="cell q-b"><i style="height:64%"></i><b>B</b></span><span class="cell q-b"><i style="height:30%"></i><b>B</b></span><span class="cell q-b"><i style="height:49%"></i><b>B</b></span><span class="cell q-b"><i style="height:87%"></i><b>B</b></span><span class="cell q-b"><i style="height:0%"></i><b>B</b></span></div></div></div>
<p class="caption">A’s running jobs are never stopped</p></div></div></foreignObject></g>
<g class="frame" style="animation-delay:4.5s"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" class="rc"><div class="in">
<div class="term"><p class="bar"><i></i><i></i><i></i><span>storage</span></p><pre class="cmd">$ rota set-priority
    --batch_dir &quot;$B&quot;
    --schedule_priority 90</pre><pre class="line">$ rota set-priority --batch_dir &quot;$B&quot; --schedule_priority 90</pre>
<p class="mon">rota monitor: QUEUE PROGRESS</p><pre class="tbl"><span class="head">Queue Workers Priority Admission</span>
B     3-8     90 (#1)  CPU wait
A     1-0     50 (#2)  CPU wait</pre></div>
<div class="hosts"><div class="host"><p><b>storage</b><span>4 CPU</span></p><div class="cells n4"><span class="cell q-a"><i style="height:94%"></i><b>A</b></span><span class="cell q-b"><i style="height:74%"></i><b>B</b></span><span class="cell q-b"><i style="height:29%"></i><b>B</b></span><span class="cell q-b"><i style="height:97%"></i><b>B</b></span></div></div><div class="host"><p><b>worker</b><span>8 CPU</span></p><div class="cells n8"><span class="cell q-b"><i style="height:2%"></i><b>B</b></span><span class="cell q-b"><i style="height:93%"></i><b>B</b></span><span class="cell q-b"><i style="height:61%"></i><b>B</b></span><span class="cell q-b"><i style="height:28%"></i><b>B</b></span><span class="cell q-b"><i style="height:89%"></i><b>B</b></span><span class="cell q-b"><i style="height:92%"></i><b>B</b></span><span class="cell q-b"><i style="height:43%"></i><b>B</b></span><span class="cell q-b"><i style="height:44%"></i><b>B</b></span></div></div></div>
<p class="caption">As A’s jobs finish, B gets the hosts</p></div></div></foreignObject></g>
<g class="frame" style="animation-delay:6.75s"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" class="rc"><div class="in">
<div class="term"><p class="bar"><i></i><i></i><i></i><span>storage</span></p><pre class="cmd">$ rota submit ... --run_name B
  (priority 50 by default)
$ ▉</pre><pre class="line">$ rota submit ... --run_name B   (priority 50)</pre>
<p class="mon">rota monitor: QUEUE PROGRESS</p><pre class="tbl"><span class="head">Queue Workers Priority Admission</span>
A     2-4     50 (#1)  CPU wait
B     2-4     50 (#1)  CPU wait</pre></div>
<div class="hosts"><div class="host"><p><b>storage</b><span>4 CPU</span></p><div class="cells n4"><span class="cell q-a"><i style="height:2%"></i><b>A</b></span><span class="cell q-b"><i style="height:55%"></i><b>B</b></span><span class="cell q-a"><i style="height:96%"></i><b>A</b></span><span class="cell q-b"><i style="height:76%"></i><b>B</b></span></div></div><div class="host"><p><b>worker</b><span>8 CPU</span></p><div class="cells n8"><span class="cell q-b"><i style="height:81%"></i><b>B</b></span><span class="cell q-b"><i style="height:91%"></i><b>B</b></span><span class="cell q-b"><i style="height:38%"></i><b>B</b></span><span class="cell q-a"><i style="height:82%"></i><b>A</b></span><span class="cell q-b"><i style="height:35%"></i><b>B</b></span><span class="cell q-a"><i style="height:87%"></i><b>A</b></span><span class="cell q-a"><i style="height:96%"></i><b>A</b></span><span class="cell q-a"><i style="height:22%"></i><b>A</b></span></div></div></div>
<p class="caption">A and B at priority 50 share the slots</p></div></div></foreignObject></g>
</svg>
