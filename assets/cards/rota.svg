<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" data-period="9" data-frames="4" focusable="false">
<style>
[data-art="rota"] .frame + .frame { opacity: 0; }
[data-art="rota"] .frame.first { will-change: opacity; }
[data-art="rota"] text { font-family: ui-monospace,'SF Mono',Menlo,Consolas,monospace; }
[data-art="rota"] .title { font: 600 6.5px system-ui,sans-serif; fill: #8b95a7; }
[data-art="rota"] .cmd { font-size: 7.4px; fill: #e6eaf2; white-space: pre; }
[data-art="rota"] .head { font-size: 6.4px; fill: #808080; white-space: pre; }
[data-art="rota"] .row { font-size: 6.4px; fill: #afd7ff; white-space: pre; }
[data-art="rota"] .host { font: 700 8.5px system-ui,sans-serif; fill: #e6eaf2; }
[data-art="rota"] .units { font: 6.5px system-ui,sans-serif; fill: #8b95a7; text-anchor: end; }
[data-art="rota"] .letter { font-size: 9px; font-weight: 700; fill: #fff; text-anchor: middle; paint-order: stroke; stroke: #0d1117; stroke-width: 2px; }
[data-art="rota"] .caption { font: 600 8.6px system-ui,sans-serif; fill: var(--art-ink); }
[data-art="rota"][data-started] .frame { animation: rota-frame 9s step-end infinite; }
@keyframes rota-frame { 0% { opacity: 1; } 25% { opacity: 0; } 100% { opacity: 0; } }
</style>
