[data-art="pocket-language-guide"] .converse-label, [data-art="pocket-language-guide"] .converse-heading { fill:rgb(17, 24, 32);text-anchor:middle;dominant-baseline:central; }
[data-art="pocket-language-guide"] .converse-label { font-size:12px; }
[data-art="pocket-language-guide"] .converse-heading { font-size:13px;font-weight:700; }
[data-art="pocket-language-guide"] .message-paper { fill:rgb(11, 103, 163); }
[data-art="pocket-language-guide"] .message .message-script, [data-art="pocket-language-guide"] .message .message-gloss, [data-art="pocket-language-guide"] .message .message-respell { fill:rgb(255, 255, 255);text-anchor:middle;dominant-baseline:central; }
[data-art="pocket-language-guide"] .message-script { font-size:40px;font-weight:600; }
[data-art="pocket-language-guide"] .message-gloss { font-size:17px;font-weight:600; }
[data-art="pocket-language-guide"] .message-respell { font-size:12px; }
