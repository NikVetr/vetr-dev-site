:root[data-theme="dark"] [data-art="pocket-language-guide"] .message-paper { fill:rgb(11, 103, 163); }
:root[data-theme="dark"] [data-art="pocket-language-guide"] .message .message-script, :root[data-theme="dark"] [data-art="pocket-language-guide"] .message .message-gloss, :root[data-theme="dark"] [data-art="pocket-language-guide"] .message .message-respell { fill:rgb(255, 255, 255); }
[data-art="pocket-language-guide"] .converse, [data-art="pocket-language-guide"] .message { opacity:0; }
[data-art="pocket-language-guide"] .paper { fill: #FFFFFF; stroke: var(--art-line); stroke-width: 0.8; }
[data-art="pocket-language-guide"] .shade { fill: #F4F6F8; }
