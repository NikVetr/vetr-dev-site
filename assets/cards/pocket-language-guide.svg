:root[data-theme="dark"] [data-art="pocket-language-guide"] .converse-paper { fill:rgb(18, 22, 25); }
:root[data-theme="dark"] [data-art="pocket-language-guide"] .converse-cell { fill:rgb(29, 52, 70);stroke:rgb(90, 169, 230); }
