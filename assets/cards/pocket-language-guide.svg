<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" data-period="19" focusable="false">
<style>
[data-art="pocket-language-guide"] .print-view { opacity:0; }
[data-art="pocket-language-guide"] .paper { fill: #FFFFFF; stroke: var(--art-line); stroke-width: 0.8; }
[data-art="pocket-language-guide"] .shade { fill: #F4F6F8; }
[data-art="pocket-language-guide"] .rule { fill: #BCC6CF; }
[data-art="pocket-language-guide"] .accent { fill: #0B67A3; }
[data-art="pocket-language-guide"] .icon { fill: none; stroke: #0B67A3; stroke-linecap: round; stroke-linejoin: round; }
[data-art="pocket-language-guide"] text { fill: #111820; font-family: ui-sans-serif, system-ui, sans-serif; }
[data-art="pocket-language-guide"] .h { font-size: 12.06px; font-weight: 700; }
[data-art="pocket-language-guide"] .n { font-size: 9.53px; font-weight: 700; fill: #3F4A55; }
[data-art="pocket-language-guide"] .script { font-size: 11.68px; font-weight: 700; }
[data-art="pocket-language-guide"] .roman { font-size: 8.85px; font-style: italic; }
[data-art="pocket-language-guide"] .gloss { font-size: 11.22px; font-weight: 700; }
[data-art="pocket-language-guide"] .respell { font-size: 8.35px; font-style: italic; fill: #3F4A55; }
[data-art="pocket-language-guide"] .e { text-anchor: end; }
[data-art="pocket-language-guide"] .lang + .lang { opacity: 0; }
[data-art="pocket-language-guide"] .still { will-change: opacity; }
:root[data-theme="dark"] [data-art="pocket-language-guide"] .paper { fill: #14191E; }
:root[data-theme="dark"] [data-art="pocket-language-guide"] .shade { fill: #1C232B; }
:root[data-theme="dark"] [data-art="pocket-language-guide"] .rule { fill: #4A5563; }
:root[data-theme="dark"] [data-art="pocket-language-guide"] .accent { fill: #5AA9E6; }
:root[data-theme="dark"] [data-art="pocket-language-guide"] .icon { stroke: #5AA9E6; }
:root[data-theme="dark"] [data-art="pocket-language-guide"] text { fill: #E8EDF2; }
:root[data-theme="dark"] [data-art="pocket-language-guide"] .n, :root[data-theme="dark"] [data-art="pocket-language-guide"] .respell { fill: #A9B4BF; }
[data-art="pocket-language-guide"] .conversation {opacity:0;} [data-art="pocket-language-guide"] .conversation-0 {opacity:1;}
[data-art="pocket-language-guide"] .conversation text {text-anchor:middle;dominant-baseline:central;font-family:ui-sans-serif,system-ui,sans-serif;}
[data-art="pocket-language-guide"] .converse-label {font-size:12px;} [data-art="pocket-language-guide"] .converse-heading {font-size:13px;font-weight:700;}
[data-art="pocket-language-guide"] .answer-label {font-size:13px;} [data-art="pocket-language-guide"] .asked {font-size:15px;font-weight:600;}
[data-art="pocket-language-guide"] .message-script {font-size:25px;font-weight:600;} [data-art="pocket-language-guide"] .message-gloss {font-size:15px;font-weight:600;}
[data-art="pocket-language-guide"] .message-respell,[data-art="pocket-language-guide"] .reply-control {font-size:11px;}
[data-art="pocket-language-guide"] .converse-paper {fill:rgb(255, 255, 255);}
[data-art="pocket-language-guide"] .converse-cell {fill:rgb(230, 240, 247);stroke:rgb(11, 103, 163);stroke-width:.8;}
[data-art="pocket-language-guide"] .selected {stroke:rgb(17, 24, 32);stroke-width:1.8;}
[data-art="pocket-language-guide"] .conversation text {fill:rgb(17, 24, 32);}
[data-art="pocket-language-guide"] .message-paper {fill:rgb(11, 103, 163);}
[data-art="pocket-language-guide"] .incoming {fill:rgb(230, 240, 247);}
[data-art="pocket-language-guide"] .message-script,[data-art="pocket-language-guide"] .message-gloss,[data-art="pocket-language-guide"] .message-respell {fill:rgb(255, 255, 255);}
:root[data-theme="dark"] [data-art="pocket-language-guide"] .converse-paper {fill:rgb(18, 22, 25);}
:root[data-theme="dark"] [data-art="pocket-language-guide"] .converse-cell {fill:rgb(29, 52, 70);stroke:rgb(90, 169, 230);stroke-width:.8;}
:root[data-theme="dark"] [data-art="pocket-language-guide"] .selected {stroke:rgb(232, 237, 242);stroke-width:1.8;}
:root[data-theme="dark"] [data-art="pocket-language-guide"] .conversation text {fill:rgb(232, 237, 242);}
:root[data-theme="dark"] [data-art="pocket-language-guide"] .message-paper {fill:rgb(11, 103, 163);}
:root[data-theme="dark"] [data-art="pocket-language-guide"] .incoming {fill:rgb(29, 52, 70);}
:root[data-theme="dark"] [data-art="pocket-language-guide"] .message-script,:root[data-theme="dark"] [data-art="pocket-language-guide"] .message-gloss,:root[data-theme="dark"] [data-art="pocket-language-guide"] .message-respell {fill:rgb(255, 255, 255);}
@media (prefers-reduced-motion: no-preference) {
[data-art="pocket-language-guide"][data-started] .conversation-0 {animation:pocket-language-guide-scene-0 19s linear infinite;}
@keyframes pocket-language-guide-scene-0 {0% {opacity:1;} 10.789% {opacity:1;} 11.579%,99.2% {opacity:0;} 100% {opacity:1;}}
[data-art="pocket-language-guide"][data-started] .conversation-1 {animation:pocket-language-guide-scene-1 19s linear infinite;}
@keyframes pocket-language-guide-scene-1 {0%,10.789%,22.105%,100% {opacity:0;} 11.579%,21.316% {opacity:1;}}
[data-art="pocket-language-guide"][data-started] .conversation-2 {animation:pocket-language-guide-scene-2 19s linear infinite;}
@keyframes pocket-language-guide-scene-2 {0%,21.316%,36.842%,100% {opacity:0;} 22.105%,36.053% {opacity:1;}}
[data-art="pocket-language-guide"][data-started] .conversation-3 {animation:pocket-language-guide-scene-3 19s linear infinite;}
@keyframes pocket-language-guide-scene-3 {0%,36.053%,46.316%,100% {opacity:0;} 36.842%,45.526% {opacity:1;}}
[data-art="pocket-language-guide"][data-started] .conversation-4 {animation:pocket-language-guide-scene-4 19s linear infinite;}
@keyframes pocket-language-guide-scene-4 {0%,45.526%,57.895%,100% {opacity:0;} 46.316%,57.105% {opacity:1;}}
[data-art="pocket-language-guide"][data-started] .conversation-5 {animation:pocket-language-guide-scene-5 19s linear infinite;}
@keyframes pocket-language-guide-scene-5 {0%,57.105%,68.421%,100% {opacity:0;} 57.895%,67.632% {opacity:1;}}
[data-art="pocket-language-guide"][data-started] .conversation-6 {animation:pocket-language-guide-scene-6 19s linear infinite;}
@keyframes pocket-language-guide-scene-6 {0%,67.632%,80%,100% {opacity:0;} 68.421%,79.211% {opacity:1;}}
[data-art="pocket-language-guide"][data-started] .conversation-7 {animation:pocket-language-guide-scene-7 19s linear infinite;}
@keyframes pocket-language-guide-scene-7 {0%,79.211%,88.421%,100% {opacity:0;} 80%,87.632% {opacity:1;}}

[data-art="pocket-language-guide"][data-started] .print-view { animation:pocket-language-guide-print 19s linear infinite; }
@keyframes pocket-language-guide-print { 0%,88.4%,100% { opacity:0; } 89.5%,98.5% { opacity:1; } }
}
</style>
