<g class="lang still" lang="ja"><text class="n e" x="302" y="28.2">日本語</text><text class="script" x="20.8" y="47.1">こんにちは</text><text class="gloss e" x="300.5" y="47.1">Hello</text><text class="roman" x="20.8" y="57.2">konnichiwa</text><text class="respell e" x="300.5" y="57.2">kohn-nih-chih-wah</text><text class="script" x="20.8" y="72.5">おはようございます</text><text class="gloss e" x="300.5" y="72.5">Good morning</text><text class="roman" x="20.8" y="82.6">ohayō gozaimasu</text><text class="respell e" x="300.5" y="82.6">oh-hah-yohh goh-zah-i-mahss</text><text class="script" x="20.8" y="97.9">こんばんは</text><text class="gloss e" x="300.5" y="97.9">Good evening</text><text class="roman" x="20.8" y="108">konbanwa</text><text class="respell e" x="300.5" y="108">kohm-bahn-wah</text><text class="script" x="20.8" y="123.3">さようなら</text><text class="gloss e" x="300.5" y="123.3">Goodbye</text><text class="roman" x="20.8" y="133.4">sayōnara</text><text class="respell e" x="300.5" y="133.4">sah-yohh-nah-rah</text><text class="script" x="20.8" y="148.7">ありがとうございます</text><text class="gloss e" x="300.5" y="148.7">Thank you</text><text class="roman" x="20.8" y="158.8">arigatō gozaimasu</text><text class="respell e" x="300.5" y="158.8">ah-rih-gah-tohh goh-zah-i-mahss</text></g></g><g class="conversation conversation-0"><rect class="converse-paper" x="5" y="4" width="310" height="172" rx="4"/><text class="converse-heading" x="160" y="21"><tspan x="160" dy="0">Converse · English → 日本語</tspan></text><rect class="converse-cell" x="11" y="34" width="146" height="39" rx="5"/><text class="converse-label" x="84" y="54"><tspan x="84" dy="0">Hello</tspan></text><rect class="converse-cell selected" x="163" y="34" width="146" height="39" rx="5"/><text class="converse-label" x="236" y="47"><tspan x="236" dy="0">Do you speak</tspan><tspan x="236" dy="14">English?</tspan></text><rect class="converse-cell" x="11" y="79" width="146" height="39" rx="5"/><text class="converse-label" x="84" y="92"><tspan x="84" dy="0">Please speak more</tspan><tspan x="84" dy="14">slowly</tspan></text><rect class="converse-cell" x="163" y="79" width="146" height="39" rx="5"/><text class="converse-label" x="236" y="99"><tspan x="236" dy="0">Please write it down</tspan></text><rect class="converse-cell" x="11" y="124" width="146" height="39" rx="5"/><text class="converse-label" x="84" y="144"><tspan x="84" dy="0">Thank you</tspan></text><rect class="converse-cell" x="163" y="124" width="146" height="39" rx="5"/><text class="converse-label" x="236" y="144"><tspan x="236" dy="0">Goodbye</tspan></text></g><g class="conversation conversation-1"><rect class="message-paper" x="5" y="4" width="310" height="172" rx="4"/><text class="message-script" x="160" y="65"><tspan x="160" dy="0">英語を話せますか？</tspan></text><text class="message-gloss" x="160" y="125"><tspan x="160" dy="0">Do you speak English?</tspan></text><text class="message-respell" x="160" y="151"><tspan x="160" dy="0">ehh-goh oh hah-nah-seh-mahss kah?</tspan></text><text class="reply-control" x="280" y="101"><tspan x="280" dy="0">返信→</tspan></text></g><g class="conversation conversation-2"><rect class="converse-paper" x="5" y="4" width="310" height="172" rx="4"/><text class="asked" x="160" y="21"><tspan x="160" dy="0">英語を話せますか？</tspan></text><rect class="converse-cell" x="11" y="39" width="146" height="38" rx="5"/><text class="answer-label" x="84" y="58"><tspan x="84" dy="0">はい</tspan></text><rect class="converse-cell" x="163" y="39" width="146" height="38" rx="5"/><text class="answer-label" x="236" y="58"><tspan x="236" dy="0">いいえ</tspan></text><rect class="converse-cell selected" x="11" y="83" width="146" height="38" rx="5"/><text class="answer-label" x="84" y="102"><tspan x="84" dy="0">少し</tspan></text><rect class="converse-cell" x="163" y="83" width="146" height="38" rx="5"/><text class="answer-label" x="236" y="102"><tspan x="236" dy="0">手伝える人を探します</tspan></text><rect class="converse-cell" x="11" y="127" width="146" height="38" rx="5"/><text class="answer-label" x="84" y="138"><tspan x="84" dy="0">言いたいことはこの中に</tspan><tspan x="84" dy="16">ありません</tspan></text></g><g class="conversation conversation-3"><rect class="message-paper incoming" x="5" y="4" width="310" height="172" rx="4"/><text class="message-script" x="160" y="65"><tspan x="160" dy="0">a little</tspan></text><text class="message-gloss" x="160" y="125"><tspan x="160" dy="0">少し</tspan></text><text class="message-respell" x="160" y="151"><tspan x="160" dy="0"></tspan></text></g><g class="conversation conversation-4"><rect class="converse-paper" x="5" y="4" width="310" height="172" rx="4"/><text class="converse-heading" x="160" y="21"><tspan x="160" dy="0">Converse · English → 日本語</tspan></text><rect class="converse-cell" x="11" y="34" width="146" height="39" rx="5"/><text class="converse-label" x="84" y="54"><tspan x="84" dy="0">Hello</tspan></text><rect class="converse-cell" x="163" y="34" width="146" height="39" rx="5"/><text class="converse-label" x="236" y="47"><tspan x="236" dy="0">Do you speak</tspan><tspan x="236" dy="14">English?</tspan></text><rect class="converse-cell selected" x="11" y="79" width="146" height="39" rx="5"/><text class="converse-label" x="84" y="92"><tspan x="84" dy="0">Please speak more</tspan><tspan x="84" dy="14">slowly</tspan></text><rect class="converse-cell" x="163" y="79" width="146" height="39" rx="5"/><text class="converse-label" x="236" y="99"><tspan x="236" dy="0">Please write it down</tspan></text><rect class="converse-cell" x="11" y="124" width="146" height="39" rx="5"/><text class="converse-label" x="84" y="144"><tspan x="84" dy="0">Thank you</tspan></text><rect class="converse-cell" x="163" y="124" width="146" height="39" rx="5"/><text class="converse-label" x="236" y="144"><tspan x="236" dy="0">Goodbye</tspan></text></g><g class="conversation conversation-5"><rect class="message-paper" x="5" y="4" width="310" height="172" rx="4"/><text class="message-script" x="160" y="65"><tspan x="160" dy="0">もっとゆっくり話してください</tspan></text><text class="message-gloss" x="160" y="125"><tspan x="160" dy="0">Please speak more slowly</tspan></text><text class="message-respell" x="160" y="144.5"><tspan x="160" dy="0">mot-toh yuk-ku-rih hah-nah-shih-teh</tspan><tspan x="160" dy="13">ku-dah-sah-i</tspan></text><text class="reply-control" x="280" y="101"><tspan x="280" dy="0">返信→</tspan></text></g><g class="conversation conversation-6"><rect class="converse-paper" x="5" y="4" width="310" height="172" rx="4"/><text class="asked" x="160" y="21"><tspan x="160" dy="0">もっとゆっくり話してください</tspan></text><rect class="converse-cell selected" x="11" y="39" width="146" height="38" rx="5"/><text class="answer-label" x="84" y="58"><tspan x="84" dy="0">いいです</tspan></text><rect class="converse-cell" x="163" y="39" width="146" height="38" rx="5"/><text class="answer-label" x="236" y="58"><tspan x="236" dy="0">書きます</tspan></text><rect class="converse-cell" x="11" y="83" width="146" height="38" rx="5"/><text class="answer-label" x="84" y="102"><tspan x="84" dy="0">少々お待ちください</tspan></text><rect class="converse-cell" x="163" y="83" width="146" height="38" rx="5"/><text class="answer-label" x="236" y="102"><tspan x="236" dy="0">手伝える人を探します</tspan></text><rect class="converse-cell" x="11" y="127" width="146" height="38" rx="5"/><text class="answer-label" x="84" y="138"><tspan x="84" dy="0">言いたいことはこの中に</tspan><tspan x="84" dy="16">ありません</tspan></text></g><g class="conversation conversation-7"><rect class="message-paper incoming" x="5" y="4" width="310" height="172" rx="4"/><text class="message-script" x="160" y="65"><tspan x="160" dy="0">okay</tspan></text><text class="message-gloss" x="160" y="125"><tspan x="160" dy="0">いいです</tspan></text><text class="message-respell" x="160" y="151"><tspan x="160" dy="0"></tspan></text></g>
