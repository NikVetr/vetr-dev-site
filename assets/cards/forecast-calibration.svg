<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" data-period="4.95" focusable="false">
<style>
[data-art="forecast-calibration"] .grid { fill: none; stroke: var(--art-line); stroke-width: 0.6; }
[data-art="forecast-calibration"] .axes { fill: none; stroke: var(--art-muted); stroke-width: 1; }
[data-art="forecast-calibration"] .worlds path { fill: none; stroke: var(--art-ink); stroke-opacity: 0.032; stroke-width: 1; }
[data-art="forecast-calibration"] .diagonal { stroke: var(--art-muted); stroke-width: 1.3; stroke-dasharray: 5 4; }
[data-art="forecast-calibration"] .picked path { fill: none; stroke: var(--art-ink); stroke-width: 1.8; stroke-linejoin: round; opacity: 0; }
[data-art="forecast-calibration"] .observed { fill: none; stroke: #c62828; stroke-width: 2.6; stroke-linejoin: round; }
[data-art="forecast-calibration"] .markers > * { fill: #c62828; stroke: var(--surface); stroke-width: 1.2; }
:root[data-theme="dark"] [data-art="forecast-calibration"] .observed { stroke: #ff6b6b; }
:root[data-theme="dark"] [data-art="forecast-calibration"] .markers > * { fill: #ff6b6b; }
@media (prefers-reduced-motion: no-preference) {
[data-art="forecast-calibration"][data-playing] .picked path { animation: forecast-calibration-pick 4.95s linear infinite; }
@keyframes forecast-calibration-pick { 0% { opacity: 0; } 11.111% { opacity: 0.9; } 22.222% { opacity: 0; } 100% { opacity: 0; } }
}
</style>
