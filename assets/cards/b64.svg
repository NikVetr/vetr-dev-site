<span class="caption">3 encoded layers</span>
<code class="value ">WVVoU01HTklUVFpNZVRreVdsaFNlVXh0VW14a2FUZzk=</code><span class="steps"><i class="done current"></i><i class=" "></i><i class=" "></i><i class=" "></i></span></div></foreignObject></g>
<g class="frame" style="animation-delay:2s"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" class="decode-stage">
<span class="caption">2 encoded layers</span>
<code class="value ">YUhSMGNITTZMeTkyWlhSeUxtUmxkaTg9</code><span class="steps"><i class="done "></i><i class="done current"></i><i class=" "></i><i class=" "></i></span></div></foreignObject></g>
