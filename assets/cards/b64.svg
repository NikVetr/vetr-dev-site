<svg xmlns="http://www.w3.org/2000/svg" data-period="6" data-frames="6" focusable="false">
<style>
[data-art="b64"] .frame + .frame { opacity: 0; }
[data-art="b64"] .frame.first { will-change: opacity; }
[data-art="b64"] .decode-stage{box-sizing:border-box;width:100%;height:100%;padding:5cqh 5cqw;display:grid;grid-template-rows:auto minmax(0,1fr) auto;align-items:center;justify-items:center;border:1px solid var(--art-line);color:var(--art-ink);text-align:center}
[data-art="b64"] .caption{font:clamp(11px,min(4.6cqw,11cqh),20px) system-ui,sans-serif;color:var(--art-muted)}
[data-art="b64"] .value{font:clamp(12px,min(5.2cqw,13cqh),28px)/1.3 ui-monospace,monospace;overflow-wrap:anywhere;min-width:0}
[data-art="b64"] .decoded{font-size:clamp(15px,min(7.8cqw,20cqh),40px);color:var(--primary)}
[data-art="b64"] .steps{width:55%;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(var(--art-line),var(--art-line)) center / 100% 2px no-repeat}
[data-art="b64"] .steps i{width:clamp(6px,2.4cqw,11px);aspect-ratio:1;border-radius:50%;background:var(--art-line)}
[data-art="b64"] .steps .done{background:var(--primary)} [data-art="b64"] .steps .current{transform:scale(1.45)}
[data-art="b64"][data-started] .frame { animation: b64-frame 6s step-end infinite; }
@keyframes b64-frame { 0% { opacity: 1; } 16.666667% { opacity: 0; } 100% { opacity: 0; } }
</style>
<g class="frame first"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" class="decode-stage">
<span class="caption">Decoded link</span>
<code class="value decoded">https://vetr.dev/</code><span class="steps"><i class="done "></i><i class="done "></i><i class="done "></i><i class="done current"></i></span></div></foreignObject></g>
