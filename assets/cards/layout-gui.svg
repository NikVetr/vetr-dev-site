[data-art="layout-gui"] .drawing-layout{display:grid;grid-template-columns:minmax(0,min(48%,94cqh)) minmax(0,1fr);gap:2cqw;height:100%;box-sizing:border-box;padding:3cqh 2cqw}
[data-art="layout-gui"] .drawing-layout > svg{width:100%;height:100%;min-height:0}
[data-art="layout-gui"] .code-panel{position:relative;container-type:size;border:1px solid var(--art-line);border-radius:3px;background:var(--surface);min-width:0;min-height:0}
@container layout-preview (max-aspect-ratio:1.2/1){[data-art="layout-gui"] .drawing-layout{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
[data-art="layout-gui"] .canvas { fill: var(--surface); stroke: var(--art-line); stroke-width: 1; }
[data-art="layout-gui"] .grid { fill: none; stroke: var(--art-line); stroke-width: 0.6; }
[data-art="layout-gui"] .panel rect { stroke: #00000025; stroke-width: 0.8; }
[data-art="layout-gui"] .panel text { fill: #222; font-weight: 700; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-anchor: middle; dominant-baseline: central; }
[data-art="layout-gui"] .preview { fill-opacity: 0.6; stroke: #3b82f6; stroke-width: 1.2; opacity: 0; }
[data-art="layout-gui"] .code{position:absolute;inset:0;display:grid;align-content:center;margin:0;padding:0 3%;color:var(--art-ink);font:min(5.5cqw,5.68cqh) / 1.35 ui-monospace,monospace}
@container (min-aspect-ratio:1.9/1){[data-art="layout-gui"] .code{grid-auto-flow:column;grid-template-rows:repeat(var(--split),auto);grid-auto-columns:minmax(0,1fr);gap:0 3%;font-size:min(2.63cqw,11.36cqh)}}
