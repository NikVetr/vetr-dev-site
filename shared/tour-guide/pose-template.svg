<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- One tour-guide pose (see POSES.md beside this file). Draw the character in the "art" group, feet on the ground
       line (y = 228) and centred on the anchor (x = 120), at the same scale in every pose. Delete the "guides" group
       before saving as <character>-<pose>.svg. -->
  <g id="guides" fill="none" font-family="sans-serif" font-size="8">
    <rect x="12" y="12" width="216" height="224" stroke="#9ab" stroke-dasharray="4 3"/>
    <line x1="0" y1="228" x2="240" y2="228" stroke="#e05a47" stroke-width="1"/>
    <path d="M120 220v16M112 228h16" stroke="#e05a47" stroke-width="1.5"/>
    <path d="M150 20h40m-6-4 6 4-6 4" stroke="#9ab"/>
    <text x="152" y="34" fill="#789">faces this way</text>
    <text x="16" y="224" fill="#e05a47">ground line y = 228</text>
    <text x="124" y="238" fill="#e05a47">anchor x = 120</text>
    <text x="16" y="22" fill="#789">keep the art inside the dashed box</text>
  </g>
  <g id="art"></g>
</svg>
